    TripletNotFound:
      description: Resource not found (triplet envelope)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TripletErrorResponse'
          example:
            error: not_found
            code: NOT_FOUND
            message: Workflow not found
    TripletBadRequest:
      description: Invalid request (triplet envelope)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TripletErrorResponse'
          example:
            error: bad_request
            code: BAD_REQUEST
            message: workflow_name is required
    StepRequestTooLarge:
      description: 'The request body is over 1 MiB (1,048,576 bytes). A route whose body

        carries a step''s content bounds it and refuses a larger body WHOLE,

        before decoding it: the body is never cut to fit, so no step is gated,

        planned or run. The bound is the orchestrator''s and is the same on

        every such route (#4249).

        '
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            - code
            - message
            - limit_bytes
            properties:
              error:
                type: string
                enum:
                - request_too_large
              code:
                type: string
                enum:
                - REQUEST_TOO_LARGE
              message:
                type: string
              limit_bytes:
                type: integer
                enum:
                - 1048576
          example:
            error: request_too_large
            code: REQUEST_TOO_LARGE
            message: request body exceeds 1048576 bytes; nothing was gated or run
            limit_bytes: 1048576
    TripletConflict:
      description: Conflicting state (triplet envelope)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TripletErrorResponse'
          example:
            error: workflow_terminal
            code: WORKFLOW_TERMINAL
            message: Workflow is already in a terminal state
