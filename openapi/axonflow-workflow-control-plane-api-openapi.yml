    ApprovalResponse:
      type: object
      description: 'Rich response returned by the WCP `/approve` and `/reject` endpoints

        and by the MAP plan-scoped equivalents

        (`/api/v1/plans/{id}/steps/{step_id}/approve|reject`). Both planes

        project through the same helper — see ADR-046 (HITL response parity)

        and ADR-045 (retry_context wire contract). A refused approval answers

        the same status on both planes: 409 when the approval has expired

        (`approval_expired`), 503 when its state cannot be read

        (`approval_state_unreadable`).


        `decision` resolves to `allow` on a successful approval (the step can

        now proceed) or `block` on rejection (workflow aborted). `plan_id` is

        populated only on MAP-plane responses; on WCP-plane responses it is

        omitted. `retry_context` is always present and mirrors the StepGate

        `retry_context` shape.

        '
      properties:
        workflow_id:
          type: string
          description: Underlying WCP workflow identifier
          example: wf_41231a72-9b0c-4f5e-8a13-6d2e0c7b4f91
        plan_id:
          type: string
          description: 'MAP plan id — present on MAP-plane responses. Omitted on WCP-plane

            responses (WCP has no plan concept).

            '
          example: plan-42
        step_id:
          type: string
          description: Step that was approved or rejected
          example: step-2
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - expired
          description: 'Flat string alias of `approval_status`. Both fields always carry

            the same value — `status` is convenient for loggers, dashboards,

            and clients that prefer a simple string; `approval_status` is the

            typed source of truth. First-class on both the WCP and MAP

            response shapes so existing clients reading either field keep

            working without branching.

            '
          example: approved
        decision:
          type: string
          enum:
          - allow
          - block
          - require_approval
          description: 'Post-approval decision. Approved `require_approval` steps resolve

            to `allow`; rejected to `block`. `require_approval` on an

            approve/reject response means the step is still pending.

            '
          example: allow
        reason:
          type: string
          description: 'Decision reason text. Approved / rejected responses prefix the

            original policy reason with `Approved:` or `Rejected:`.

            '
          example: 'Approved: High-value transfer requires oversight'
        approval_status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - expired
          description: 'Terminal approval status after the mutation landed. `expired` is an

            auto-timeout (Evaluation-tier) — a terminal not-approved state that

            blocks the step, kept distinct from a human `rejected`.

            '
          example: approved
        approval_id:
          type: string
          format: uuid
          description: 'HITL queue entry UUID of the hold this decision acted on: the

            step''s pending hold, else its newest (hold 1 is UUID v5 over

            `workflow_id + ":" + step_id`; hold n >= 2, a step held again

            after an earlier hold was decided, is UUID v5 over

            `workflow_id + ":" + step_id + "#" + n`). Matches the queue row

            written by the WCP HITL adapter. With no hold for the step (a

            step-gate row outside its hold ids is not a hold) it is the hold-1

            id; empty on the legacy in-memory MAP flow, and omitted when the

            queue could not be read.

            '
          example: 318a270f-7b42-5c56-a191-8dbd1bf2e1e4
        approved_by:
          type: string
          description: Identity (X-User-ID, typically email) that approved the step
          example: fraud.analyst@banking.example
        approved_at:
          type: string
          format: date-time
          description: Timestamp when the approval was persisted
        rejected_by:
          type: string
          description: Identity that rejected the step (rejection path only)
          example: fraud.analyst@banking.example
        rejected_at:
          type: string
          format: date-time
          description: Timestamp when the rejection was persisted
        policies_matched:
          type: array
          description: Policies that triggered the original `require_approval` decision
          items:
            $ref: '#/components/schemas/PolicyMatch'
        retry_context:
          $ref: '#/components/schemas/RetryContext'
        message:
          type: string
          description: Human-readable status summary
          example: Step approved
