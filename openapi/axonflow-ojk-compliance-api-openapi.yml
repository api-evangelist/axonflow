components:
  schemas:
    OJKAuditExportRequest:
      type: object
      required:
      - start_date
      - end_date
      properties:
        start_date:
          type: string
          format: date
          description: Window start (YYYY-MM-DD)
        end_date:
          type: string
          format: date
          description: Window end (YYYY-MM-DD, not before start_date; range at most 5 years)
        format:
          type: string
          enum:
          - json
          - csv
          - xml
          default: json
          description: 'All three values are ACCEPTED. This endpoint PRODUCES only JSON:

            a csv or xml request succeeds and returns the same JSON body, with

            the response reporting `format: json`, echoing the ask in

            `requested_format` and explaining it in `format_note`. It does NOT

            label a JSON body as csv (#3242).

            '
        framework:
          type: string
          enum:
          - OJK_AI_GOVERNANCE
          - UU_PDP
          - BI_PJP
          - OJK_BI_COMBINED
          default: OJK_BI_COMBINED
        data_types:
          type: array
          description: Defaults to [all]
          items:
            type: string
            enum:
            - policy_violations
            - llm_calls
            - decision_chain
            - hitl_oversight
            - pii_redactions
            - cross_border_transfers
            - breach_notifications
            - all
        filters:
          type: object
          properties:
            agent_ids:
              type: array
              items:
                type: string
            user_ids:
              type: array
              items:
                type: string
            severity:
              type: array
              items:
                type: string
            policy_types:
              type: array
              items:
                type: string
        include_pii:
          type: boolean
          default: false
    OJKAuditExportResponse:
      type: object
      properties:
        export_id:
          type: string
        status:
          type: string
