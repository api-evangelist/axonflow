components:
  schemas:
    PolicyEvaluationResult:
      type: object
      description: 'The policy verdict carried on every orchestrator response. Its property

        SET is held equal to the Go type''s JSON members by

        `TestThePublishedSchemasMatchTheTypesThePlatformMarshals`, which

        compares the two by reflection, so a field added to one and not the

        other fails CI rather than reaching a spec-generated client (#3724).

        The properties are also written in the Go type''s declaration order as a

        courtesy to a reader diffing the two; nothing enforces that, and order

        is not part of the contract.

        '
      properties:
        allowed:
          type: boolean
        applied_policies:
          type: array
          items:
            type: string
        risk_score:
          type: number
          minimum: 0
          maximum: 1
        severity:
          type: string
          enum:
          - critical
          - high
          - medium
          - low
          description: Highest severity among the matched policies.
        severity_policy_id:
          type: string
          description: The policy that contributed `severity`.
        required_actions:
          type: array
          items:
            type: string
        processing_time_ms:
          type: integer
        database_accessed:
          type: boolean
        evaluation_error:
          type: boolean
          description: 'Distinguishes **could not govern** from **a policy said block**,

            and is the only signal that does. True when the engine could NOT

            complete evaluation because governance-segment resolution failed

            (a resolver or storage error -- never "the caller belongs to zero

            segments"). `allowed` is always false when this is set, because the

            engine fails CLOSED on that error, so a consumer reading only

            `allowed` still behaves safely; a consumer that audits or alerts

            MUST read this field to tell an availability failure apart from a

            genuine policy match. Before it existed the only signal was the

            magic string `applied_policies: ["segment_resolution_failed"]`.

            '
        segments_resolved:
          type: boolean
          description: 'True only when a resolved, non-empty governance-segment set was

            actually factored into this verdict. False covers every legitimate

            organisation-only case -- no identity supplied, no resolver wired

            (community, or no SCIM), or the caller belongs to zero segments --

            as well as the `evaluation_error` case. None of those are failures:

            the flag exists so a reader of a policy-simulation preview does not

            mistake a legitimate org-only allow for a segment-aware one.

            '
        applied_policies_detail:
          type: array
          description: 'Structured mirror of `applied_policies` carrying each matched

            policy''s risk level and allow_override metadata, without a second

            query. No session override is applied to a result in v11 (#4252).

            '
          items:
            $ref: '#/components/schemas/AppliedPolicyDetail'
        preferred_provider:
          type: string
          description: 'LLM provider a matched routing policy prefers. When more than one

            applying route row names one, the LAST applying row in evaluation

            order wins it and the routing reason: rows are walked by priority,

            highest first, then newest first, so the winner is the

            lowest-priority applying row (#4249).

            '
        allowed_providers:
          type: array
          items:
            type: string
          description: 'Strict provider allow-list for compliance routing. Failover stays

            within this list. It is the intersection of every applying route

            row''s list, whatever their order; an empty intersection refuses the

            request (`no_compliant_provider`).

            '
        routing_reason:
          type: string
          description: Why routing was changed.
    DynamicPolicy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        type:
          type: string
          description: 'Policy type — narrower-than-category dimension surfaced on

            list/CRUD responses (e.g. risk, content, user, cost).

            '
          example: risk
        category:
          type: string
          description: 'Policy category. Dynamic policies use a `dynamic-` prefix

            (dynamic-risk, dynamic-compliance, dynamic-security,

            dynamic-cost, dynamic-access).

            '
          example: dynamic-risk
        tier:
          type: string
          enum:
          - system
          - organization
          - tenant
          description: 'Policy tier. Dynamic policies default to `tenant`;

            organization-tier policies require Enterprise.

            '
        priority:
          type: integer
          description: 'Evaluation priority — lower values evaluate first. Useful

            when multiple dynamic policies match the same request.

            '
          example: 0
        created_at:
          type: string
          format: date-time
          description: When the dynamic policy was first inserted.
        updated_at:
          type: string
          format: date-time
          description: When the dynamic policy was last modified.
        conditions:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              operator:
                type: string
                enum:
                - ==
                - '!='
                - '>'
                - <
                - '>='
                - <=
                - contains
                - matches
              value:
                description: Comparison value
        actions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - block
                - allow
                - rate_limit
                - redact
                - alert
              reason:
                type: string
              limit:
                type: integer
    AppliedPolicyDetail:
      type: object
      description: 'One structured per-policy match inside `PolicyEvaluationResult`.

        '
      properties:
        policy_id:
          type: string
        policy_name:
          type: string
        description:
          type: string
        action:
          type: string
        risk_level:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        allow_override:
          type: boolean
          description: False if and only if the policy forbids a session override.
        matched_rule:
          type: string
        segment_id:
          type: string
          description: 'The governance segment this policy is scoped to, or absent when it

            is not segment-scoped. ATTRIBUTION AND AUDIT ONLY -- it is not an

            override-eligibility signal anywhere: a segment-scoped policy uses

            the same `allow_override` contract as a tenant policy.

            '
    CreatePolicyRequest:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
          - static
          - dynamic
        category:
          type: string
        tier:
          type: string
          enum:
          - organization
          - tenant
          default: tenant
        pattern:
          type: string
          description: Required for static policies
        action:
          type: string
          enum:
          - block
          - require_approval
          - redact
          - warn
          - log
        severity:
          type: string
          enum:
          - critical
          - high
          - medium
          - low
        priority:
          type: integer
          default: 100
        enabled:
          type: boolean
          default: true
        conditions:
          type: array
          items:
            type: object
          description: Required for dynamic policies
        actions:
          type: array
          items:
            type: object
          description: Required for dynamic policies
    PoliciesListResponse:
      type: object
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        pagination:
          type: object
          properties:
            page:
              type: integer
            page_size:
              type: integer
            total_items:
              type: integer
            total_pages:
              type: integer
    CodedErrorResponse:
      type: object
      description: 'The CODED error envelope: `{error: {code, message}}`, where `code` is a

        screaming-snake string enum. This is what the per-handler `writeError`

        methods emit across the policy API, the LLM provider API, the agents,

        template, unified-execution and media-governance APIs, and every

        handler in the RBI module (362 call sites in total).


        It is one of TWO error SHAPES this document describes. `code` is a

        STRING on this envelope; it is never an HTTP status integer.

        `LLMProviderAPIError` is this shape with the `code` enum constrained to

        the five values the LLM-provider handlers emit.

        '
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code, screaming snake case.
              example: NOT_FOUND
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    UserContext:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
        region:
          type: string
          description: User's region, read by geo-based routing policies.
        permissions:
          type: array
          items:
            type: string
        tenant_id:
          type: string
        org_id:
          type: string
          description: Organisation for multi-tenant isolation, populated from the X-Org-ID header the agent stamps on the trusted hop.
    Policy:
      type: object
      description: A policy with full metadata
      properties:
        id:
          type: string
          format: uuid
        policy_id:
          type: string
          description: Human-readable identifier
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
