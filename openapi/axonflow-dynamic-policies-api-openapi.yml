        enabled:
          type: boolean
        conditions:
          type: array
          items:
            type: object
          description: Conditions (for dynamic policies)
        actions:
          type: array
          items:
            type: object
          description: Actions (for dynamic policies)
        version:
          type: integer
        tenant_id:
          type: string
        organization_id:
          type: string
          description: 'The organisation that owns this policy. This is the current wire

            field name and it is not deprecated: it is unrelated to a database

            column of the same name that was retired in an earlier release. The

            two share a name and nothing else.

            '
        created_by:
