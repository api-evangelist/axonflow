          - dynamic
        category:
          type: string
        tier:
          type: string
          enum:
          - system
          - organization
          - tenant
        pattern:
          type: string
          description: Regex pattern (for static policies)
        action:
          type: string
          enum:
          - block
          - require_approval
          - redact
          - warn
          - log
        severity:
          type: string
          enum:
          - critical
          - high
          - medium
          - low
        priority:
