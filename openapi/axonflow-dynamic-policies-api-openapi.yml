openapi: 3.2.0
info:
  title: Axonflow Dynamic Policies API
  version: 11.1.0
  contact:
    name: AxonFlow Support
    url: https://getaxonflow.com/support
  license:
    name: Business Source License 1.1
    url: https://github.com/getaxonflow/axonflow/blob/main/LICENSE
  description: 'Operations tagged Dynamic Policies across 4 of this provider''s published API definitions: axonflow-orchestrator-api.yaml, axonflow-policy-api.yaml, axonflow-orchestrator-openapi.yml, axonflow-policy-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://orchestrator.getaxonflow.com
  description: Production (SaaS)
- url: http://localhost:8081
  description: Local Development
- url: https://agent.getaxonflow.com
  description: Production (Agent single entry point, ADR-024)
- url: http://localhost:8080
  description: Local development (Agent single entry point)
tags:
- name: Dynamic Policies
  description: 'Legacy policy management on `/api/v1/policies`. Reads, tests and

    simulation are served; writes answer `409 LEGACY_POLICY_WRITE_FROZEN` in

    v11 (see the `LegacyPolicyWriteFrozen` response) - author policy through

    Typed Policy Authoring instead.'
paths:
  /api/v1/policies:
    get:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: List policies
      description: 'Returns a paginated list of policies with filtering support.

        Use this for policy management in the Customer Portal.'
      operationId: listPolicies
      parameters:
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: Filter by policy type
        schema:
          type: string
          enum:
          - static
          - dynamic
      - name: enabled
        in: query
        description: Filter by enabled status
        schema:
          type: boolean
      - name: search
        in: query
        description: Search in name and description
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: sort_by
        in: query
        schema:
          type: string
          enum:
          - name
          - created_at
          - updated_at
          - priority
      - name: sort_dir
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        '200':
          description: List of policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliciesListResponse'
        '400':
          $ref: '#/components/responses/CodedBadRequest'
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
    post:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: Create policy
      description: Create a new policy
      operationId: createPolicy
      parameters:
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      - name: X-User-ID
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequest'
      responses:
        '201':
          description: Policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/CodedBadRequest'
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '409':
          $ref: '#/components/responses/LegacyPolicyWriteFrozen'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/policies/import:
    post:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: Import policies
      description: 'Bulk import policies from JSON or YAML format.

        Supports create or update semantics based on policy_id.


        On a deployment whose database connection cannot write the legacy

        policy tables (migrations/core/172), the request is refused `409

        LEGACY_POLICY_WRITE_FROZEN` before its body is read, whatever it

        contains, and the refusal names the typed authoring route. An

        owner-role deployment still imports.'
      operationId: importPolicies
      parameters:
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      - name: X-User-ID
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - policies
              properties:
                policies:
                  type: array
                  items:
                    $ref: '#/components/schemas/CreatePolicyRequest'
                mode:
                  type: string
                  enum:
                  - create
                  - upsert
                  default: upsert
                  description: Import mode - create only or upsert (create or update)
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: integer
                  updated:
                    type: integer
                  failed:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/CodedBadRequest'
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '409':
          $ref: '#/components/responses/LegacyPolicyWriteFrozen'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/policies/export:
    get:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: Export policies
      description: Export all policies in JSON or YAML format for backup or migration
      operationId: exportPolicies
      parameters:
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: Export format
        schema:
          type: string
          enum:
          - json
          - yaml
          default: json
      - name: type
        in: query
        description: Filter by policy type
        schema:
          type: string
          enum:
          - static
          - dynamic
          - all
          default: all
      responses:
        '200':
          description: Exported policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: '1.0'
                  exported_at:
                    type: string
                    format: date-time
                  policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Policy'
            application/x-yaml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/policies/{id}:
    get:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: Get policy by ID
      operationId: getPolicy
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Policy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '404':
          description: Policy not found
    put:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: Update policy
      operationId: updatePolicy
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      - name: X-User-ID
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyRequest'
      responses:
        '200':
          description: Policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/CodedBadRequest'
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '404':
          description: Policy not found
        '409':
          $ref: '#/components/responses/LegacyPolicyWriteFrozen'
    delete:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: Delete policy
      operationId: deletePolicy
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      - name: X-User-ID
        in: header
        required: false
        schema:
          type: string
      responses:
        '204':
          description: Policy deleted
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '404':
          description: Policy not found
        '409':
          $ref: '#/components/responses/LegacyPolicyWriteFrozen'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/policies/{id}/test:
    post:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: Test policy against input
      description: Test how a specific policy evaluates against sample input
      operationId: testPolicyById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                  description: Input to evaluate
                context:
                  type: object
                  description: Additional context
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyEvaluationResult'
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '404':
          description: Policy not found
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/policies/{id}/versions:
    get:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: Get policy version history
      description: 'Returns version history for a policy.

        Community edition limited to 5 versions.'
      operationId: getPolicyVersions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Version history
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy_id:
                    type: string
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        version:
                          type: integer
                        snapshot:
                          type: object
                        change_type:
                          type: string
                        changed_by:
                          type: string
                        changed_at:
                          type: string
                          format: date-time
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '404':
          description: Policy not found
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/policies/dynamic:
    get:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: List active dynamic policies
      description: 'Returns the active dynamic policies visible to the CALLING tenant:

        the tenant''s own policies plus the shared global/default baseline.

        Policies owned by other tenants are never returned in the same

        response, and requests without a resolvable tenant are rejected

        with 401 (fail closed).


        The tenant scope is read from the `X-Tenant-ID` header. When the

        request arrives through the AxonFlow Agent, that header is set from

        the validated credential and overwrites any client-supplied value,

        so the caller cannot choose the scope. The orchestrator itself does

        not authenticate this route, so a caller with direct network access

        to the orchestrator can name a tenant — deploy the orchestrator on a

        private network behind the Agent.'
      operationId: listDynamicPolicies
      responses:
        '200':
          description: List of dynamic policies visible to the calling tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DynamicPolicy'
              example:
              - id: pol_001
                name: High Risk Content Filter
                description: Block requests with high risk scores
                enabled: true
                conditions:
                - field: risk_score
                  operator: '>'
                  value: 0.8
                actions:
                - type: block
                  reason: High risk content detected
              - id: pol_002
                name: Rate Limit Premium Users
                description: Apply premium rate limits
                enabled: true
                conditions:
                - field: user.role
                  operator: ==
                  value: premium
                actions:
                - type: rate_limit
                  limit: 10000
        '401':
          description: Tenant scope could not be resolved (missing gateway-stamped X-Tenant-ID); the endpoint fails closed and returns no policy data
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/policies/test:
    post:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: Test policy evaluation
      description: Test how dynamic policies evaluate a sample request
      operationId: testPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                user:
                  $ref: '#/components/schemas/UserContext'
                request_type:
                  type: string
            example:
              query: SELECT * FROM customers WHERE credit_score < 500
              user:
                id: 123
                email: analyst@company.com
                role: analyst
              request_type: sql
      responses:
        '200':
          description: Policy evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyEvaluationResult'
              example:
                allowed: true
                applied_policies:
                - sql-injection-filter
                - pii-protection
                risk_score: 0.25
                required_actions: []
                processing_time_ms: 3
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/dynamic-policies:
    get:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: List dynamic policies
      description: 'Retrieve a paginated list of the caller''s policies, whatever their

        category: with no `category` parameter no category filter is applied,

        so rows categorised otherwise, or not at all (written through

        `/api/v1/policies`), are returned too. A `category` parameter must

        start with `dynamic-` or `media-`, and any other value is refused

        `400`. When `type=media` is passed without a category, results are

        filtered to `media-*` categories.


        `limit` is the preferred pagination parameter; `page_size` is

        deprecated but still accepted.'
      operationId: getApiV1DynamicPolicies
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - name: type
        in: query
        description: Filter by policy type
        schema:
          $ref: '#/components/schemas/PolicyType'
      - name: category
        in: query
        description: 'Filter by category. Must start with `dynamic-` or `media-`

          (e.g., dynamic-risk, media-safety); other values are rejected

          with a validation error.

          '
        schema:
          type: string
      - name: enabled
        in: query
        description: Filter by enabled status
        schema:
          type: boolean
      - name: search
        in: query
        description: Search in policy name and description
        schema:
          type: string
          maxLength: 100
      - name: page
        in: query
        description: Page number (1-indexed)
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        description: Items per page (preferred over the deprecated page_size)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: page_size
        in: query
        deprecated: true
        description: Items per page (deprecated - use limit instead)
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: sort_by
        in: query
        description: Sort field
        schema:
          type: string
          enum:
          - name
          - created_at
          - updated_at
          - priority
          default: created_at
      - name: sort_dir
        in: query
        description: Sort direction
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: List of dynamic policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliciesListResponse_2'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      x-operation-id-source: normalized
      x-operation-id-original: listDynamicPolicies
    post:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: Create a dynamic policy
      description: 'Create a new dynamic policy. `category` is required and must start

        with `dynamic-` or `media-` (e.g., dynamic-risk, media-safety).'
      operationId: createDynamicPolicy
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequest_2'
      responses:
        '201':
          description: Dynamic policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Tier validation failed (e.g., organization-tier policy without Enterprise license)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '409':
          $ref: '#/components/responses/LegacyPolicyWriteFrozen_2'
        '500':
          $ref: '#/components/responses/InternalError'
    servers:
    - url: https://agent.getaxonflow.com
      description: Production (Agent single entry point, ADR-024)
    - url: http://localhost:8080
      description: Local development (Agent single entry point)
    - url: http://localhost:8081
      description: Orchestrator direct (internal only)
  /api/v1/dynamic-policies/import:
    post:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: Import dynamic policies
      description: 'Bulk import dynamic policies from JSON. Supports up to 100 policies

        per request. Every policy must have a category starting with

        `dynamic-` or `media-`.


        On a deployment whose database connection cannot write the legacy

        policy tables (migrations/core/172), the request is refused `409

        LEGACY_POLICY_WRITE_FROZEN` before its body is read, whatever it

        contains, and the refusal names the typed authoring route. An

        owner-role deployment still imports.'
      operationId: importDynamicPolicies
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportPoliciesRequest'
      responses:
        '200':
          description: Import results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPoliciesResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/LegacyPolicyWriteFrozen_2'
        '500':
          $ref: '#/components/responses/InternalError'
    servers:
    - url: https://agent.getaxonflow.com
      description: Production (Agent single entry point, ADR-024)
    - url: http://localhost:8080
      description: Local development (Agent single entry point)
    - url: http://localhost:8081
      description: Orchestrator direct (internal only)
  /api/v1/dynamic-policies/export:
    get:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: Export dynamic policies
      description: 'Export the organization''s policies as JSON: every row the list

        route returns for the caller, whatever its category, including a

        row with no category (one written through `/api/v1/policies`). The

        same set as `/api/v1/policies/export`. Before v11.1.0 only rows with

        a `dynamic-*` or `media-*` category were included, and the rest were

        left out without notice (#4293). This family''s import still accepts

        only `dynamic-*` and `media-*` rows and refuses the whole batch at the

        first other one, so a file that carries other rows is imported

        through `/api/v1/policies/import`, which accepts them.'
      operationId: exportDynamicPolicies
      parameters:
      - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Exported dynamic policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportPoliciesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    servers:
    - url: https://agent.getaxonflow.com
      description: Production (Agent single entry point, ADR-024)
    - url: http://localhost:8080
      description: Local development (Agent single entry point)
    - url: http://localhost:8081
      description: Orchestrator direct (internal only)
  /api/v1/dynamic-policies/effective:
    get:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: Get effective dynamic policies
      description: 'Returns the enabled dynamic policies for the tenant (both `dynamic-*`

        and `media-*` categories), sorted by priority ascending. Returns up to

        100 policies.'
      operationId: getEffectiveDynamicPolicies
      parameters:
      - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Effective dynamic policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliciesListResponse_2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    servers:
    - url: https://agent.getaxonflow.com
      description: Production (Agent single entry point, ADR-024)
    - url: http://localhost:8080
      description: Local development (Agent single entry point)
    - url: http://localhost:8081
      description: Orchestrator direct (internal only)
  /api/v1/dynamic-policies/{id}:
    parameters:
    - $ref: '#/components/parameters/PolicyID'
    - $ref: '#/components/parameters/TenantID'
    get:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: Get a dynamic policy
      description: 'Retrieve a single dynamic policy by ID. Returns 404 if the policy

        exists but is not a dynamic policy (category not `dynamic-*`/`media-*`).'
      operationId: getDynamicPolicy
      responses:
        '200':
          description: Dynamic policy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      deprecated: true
      tags:
      - Dynamic Policies
      summary: Update a dynamic policy
      description: 'Update an existing dynamic policy. Only provided fields are updated.

        If `category` is changed, the new value must still start with

        `dynamic-` or `media-`.'
      operationId: updateDynamicPolicy
      parameters:
      - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyRequest_2'
      responses:
        '200':
          description: Dynamic policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Tier validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
