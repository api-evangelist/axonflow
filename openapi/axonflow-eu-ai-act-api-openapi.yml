  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Resource not found
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Invalid request body
  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      description: 'Maximum number of records to return. Defaults vary by

        endpoint; see per-endpoint description for the cap.

        '
      schema:
        type: integer
        minimum: 1
        default: 100
    OrgIDHeader:
      name: X-Org-ID
      in: header
      required: false
      description: 'Organization identifier. Falls back to authenticated org from

        the Basic auth client when omitted. Surface for callers that

        need to override (e.g. cross-org admin reads in Enterprise).

        '
      schema:
        type: string
      example: travel-us
    UserIDHeader:
      name: X-User-ID
      in: header
      required: false
      description: 'Caller identity. Defaults to the authenticated user resolved

        from the request token when omitted. Surface for service-mode

        callers that proxy on behalf of multiple users.

        '
      schema:
        type: string
    OffsetParam:
      name: offset
      in: query
      required: false
      description: 'Number of records to skip from the start of the result set.

        Pair with `limit` to walk multi-page reads.

        '
      schema:
        type: integer
        minimum: 0
        default: 0
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: OAuth2-style client credentials (clientId:clientSecret)
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enterprise JWT token (see /scripts/generate-jwt.sh)
