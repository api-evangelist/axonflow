    PendingApproval:
      type: object
      description: 'A call held for a person''s approval (#4370, PRD v11 §1.13). Pending

        is NOT allow: nothing ran, and the enforcement point must not

        forward. An approver approves the queue entry in the portal

        (Approvals), and the caller retries the same call naming

