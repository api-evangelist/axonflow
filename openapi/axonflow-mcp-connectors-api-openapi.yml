        redacted_statement:
          type: string
          description: 'The request statement with PII fields masked. A PEP fulfilling a

            Decision Mode redact_pii obligation forwards THIS value instead of

            the original. Omitted when the statement was not masked, including

            a redaction of the parameters alone (`redacted: true` with only

            `redacted_parameters`). Source of truth:

            `platform/agent/mcp_handler.go` (MCPCheckInputResponse).

            '
        redacted_parameters:
          type: object
          additionalProperties:
            type: string
          description: 'Each request parameter the redaction masked, keyed by parameter,

            as the text the request pass scanned it as: the string itself, or

            a map or list parameter''s JSON serialisation, masked as one text so

            a span across the serialisation is masked as it was matched. The

            caller decodes it where it decodes the parameter and forwards the

            masked value. A string or number parameter comes back as its text

            (a number''s decimal text) masked in place, unquoted, as a string.

            Present only for an enforcement point whose PEP handshake declares

            `field_redact` at version 2, on Enterprise; any other caller whose

            parameter the redaction masks is refused 403

            `unsupported_obligation`. Omitted when no parameter was masked, so

            a caller that never carries PII in its parameters gets a

            byte-identical response (#4264, since v11.1.0).

            '
        redaction_evaluated:
          type: boolean
          description: 'Whether the redaction detector actually ran (regardless of whether

            it masked anything). A PEP fulfilling a redact_pii obligation MUST

            fail closed when this is false — it means no detection config was

            enabled, so `redacted: false` is indistinguishable from "looked,

            found nothing" and the request must not be forwarded as clean.

