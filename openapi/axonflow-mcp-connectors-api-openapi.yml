  responses:
    MCPSegmentForbidden:
      description: "Access denied. Causes on these routes:\n\n- **Tenant mismatch**, or a connector this tenant may not access.\n- **A policy refusal**: `error` is `Request blocked: <reason>`, the\n  reason code first.\n- **A call held for a person's approval** (#4370, Enterprise):\n  `error` is `Request blocked: approval_pending: ...` and\n  `pending_approval` names the approval the retry spends (see the\n  `X-Axonflow-Approval-Id` parameter). Nothing ran.\n\n`segment_resolution_failed` is no longer a cause (it was one from\n#3447). No segment gate stands on these routes any more: the anchored\nengine reads no segments, as on decide.\n"
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: object
              properties:
                pending_approval:
                  $ref: '#/components/schemas/PendingApproval'
          example:
            success: false
            error: Tenant mismatch
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Internal server error
    Unauthorized:
      description: 'Missing or invalid authentication. Handler-written 401s use the

        `{success, error}` envelope; 401s written by the auth middleware

        use the `{"error": {"code", "message"}}` envelope (JSONError).

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: 'Authentication required: provide Authorization header with Basic auth (clientId:clientSecret)'
    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Invalid request body
    MCPPerUserTokenUnauthorized:
      description: "Missing or invalid authentication on an MCP REST route. FOUR distinct\ncauses; the status code is the same for all four, and the audit row is\nwhat distinguishes the last two.\n\n1. **Credentials.** No usable Basic auth / license credential.\n2. **A tenant the credential may not act for.**\n3. **`user_token_rejected`** -- a `user_token` WAS supplied in the\n   request body and failed to validate: malformed, expired, signed\n   with the wrong algorithm, carrying a bad signature, or revoked by\n   `jti`. **This is new behaviour on these four routes.** Previously\n   ANY user-token failure in enterprise mode was answered by\n   synthesizing a service identity and serving the request, so\n   revocation and expiry had no effect here; a presented token that\n   fails to validate is now a refused access attempt, audited and\n   returned as `401`. This is not opt-in and no flag restores the old\n   behaviour.\n4. **`user_token_required`** (#3476) -- NO `user_token` was supplied\n   and the caller's organisation requires one. **Off by default**;\n   this cause cannot occur unless an operator has set\n   `organizations.require_user_token` for that organisation, or the\n   deployment-wide `AXONFLOW_REQUIRE_USER_TOKEN` default. With the\n   posture off, a token-less enterprise caller is still served under a\n   synthetic service identity, which is the correct answer for an\n   infrastructure gateway that has no end-user token to forward.\n\nCauses 3 and 4 are recorded as reserved identifiers in the audit row's\npolicy ids and MUST NOT be collapsed: they have opposite operator\nremedies (repair the caller's token, versus provision one at all).\nQuery them with JSONB containment against\n`policy_details->'policy_ids'`, never with `LIKE` -- `_` is a\nsingle-character wildcard, so a `%user_token_required%` pattern also\nmatches unrelated prose in the same row.\n\nThese routes read the per-user token from the `user_token` field of\nthe request body. They do not read the `X-User-Token` header; that\nheader belongs to the MCP-server JSON-RPC envelope.\n\nHandler-written 401s use the `{success, error}` envelope; 401s written\nby the auth middleware use the `{\"error\": {\"code\", \"message\"}}`\nenvelope (JSONError).\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: 'Invalid user token: token has expired'
  parameters:
    LicenseKey:
      name: Authorization
      in: header
      required: true
      description: 'OAuth2-style Basic authentication header.

        Format: `Basic base64(clientId:clientSecret)`


        - `clientId`: Your organization identifier (required)

        - `clientSecret`: Authentication credential (optional for community mode)


        Not required when `DEPLOYMENT_MODE=community`.

        '
      schema:
        type: string
        example: Basic bXktb3JnOkFYT04tVjIteHh4
    ApprovalId:
      name: X-Axonflow-Approval-Id
      in: header
      required: false
      description: 'The approval a retry spends (#4370). A call held for a person''s

        approval is answered a `pending_approval` naming an id; once a

        person approves it in the portal, the caller retries the SAME call

        naming that id here (or in the body''s `approval_id` field, for a

        client that cannot set headers - a header and a field naming

        different ids are refused `approval_not_found`).


        The retry is decided exactly as the first call was. Only when it is

        again held for approval, and the approval is approved by a person

        who is not the caller, before its expiry, unspent, and granted for

        this very call (the same input, tool, route, requester and

        requirement), does it pass - and the approval is spent: it admits

        exactly one call. A call that is allowed anyway spends nothing; no

        approval lifts a deny. Every other outcome is refused with one of

        the `ApprovalHoldReason` codes. Enterprise; the Community build has

        no approval queue and ignores the header.


        WHAT "THE SAME CALL" MEANS. On the MCP routes: the connector, the

        tool, the operation, the statement and its parameters (and the row

        limit on `/mcp/resources/query`). On `/api/v1/decide`: the WHOLE

        request the engine decided - `stage`, `target`, `query` AND

        `context`. A retry that changes any of it is refused

        `bound_input_changed`: resend the same `context`, and carry

        per-request values (request ids, timestamps) in headers, never in

        `context` - the correlation id is a header.

        '
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional per-request dedup token. When supplied on POST /api/v1/mcp/check-input,

        POST /api/v1/audit/tool-call, or POST /api/v1/hitl/queue, the platform caches

        the original response for 24h and returns it byte-for-byte on subsequent

        requests carrying the same key + same authenticated tenant + same endpoint.


        Format: 1-256 chars, `^[A-Za-z0-9_.:\-/]+$`. Workflow IDs from n8n, ADK,

        or generic SDKs all fall inside this set. A malformed key returns 400

        before the handler runs.


        Cache rules: 2xx + 4xx responses are cached; 5xx is NOT cached so the

        caller''s retry can hit a fresh attempt. A cache hit returns the original

        response plus an `Idempotent-Replayed: true` response header.


        Cross-tenant collisions are impossible: tenant_id participates in the

        primary key + an RLS policy on the storage table. Two tenants using

        the same key value get distinct rows.

        '
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: ^[A-Za-z0-9_.:\-/]+$
        example: n8n-exec-abc123-node-Approve
    AxonflowPEPHandshake:
      name: X-Axonflow-PEP-Handshake
      in: header
      required: false
      description: 'The ADR-065 **PEP capability handshake**: base64url of a compact JSON

        document in which an external enforcement point declares what it is and

        which obligations it can discharge. See `PEPHandshake` for the document.


        **Absent is the default and changes nothing.** A caller that omits the

        header takes byte-for-byte the path it took before this header existed.


        **What an absent header means for a redaction depends on the plane, by

        design (PRD v11 section 1 item 16, #4257).** The MCP passes discharge a

        redaction of the content they hand back: the request pass

        (`check-input`, `check_policy`) masks the statement, and a redaction

        that masks nothing in the statement is refused `unsupported_obligation`

        to every caller, and one that masks a request parameter to every caller

        that has not declared `field_redact` at version 2 (on Community, to

        every caller) (#4264);

        the response passes (`check-output`, the MCP server''s `check_output`)

        mask the rows or the message. `/api/v1/decide` and the gateway

        pre-check return a decision rather than content, so a required

        redaction is a `field_redact` obligation for the enforcement point, and

        a caller that has not declared `field_redact` is refused

        `unsupported_obligation`. A caller that declares NO redaction

        (`capabilities: []`) is refused on each of these planes; on

        Community the MCP passes still return a checksum validator''s masked

        content to it (reachable only through a directly inserted

        `detection_action_overrides` row) until #4122.


        A header that is PRESENT and cannot be read is **refused**, never

        treated as absent: degrading a malformed declaration to "legacy caller"

        would go on handing an enforcement point obligations it had just said it

        cannot discharge. The refusal is `400` and its message names this header,

        which matters on `/api/v1/access/evaluation` where the refusal is

        rendered through that surface''s existing `incomplete_evaluation` code and

        the message is the only thing distinguishing a malformed HEADER from a

        malformed body ENVELOPE.


        Present more than once is refused: RFC 7230 permits an intermediary to

        join repeated field lines with a comma, and a comma is outside the

        base64 alphabet, so a joined pair can only decode to malformed. That is

        why the document is base64 rather than raw JSON, which would join into

        something a lenient parser might accept.


        When a decision carries a **mandatory** obligation the declared set does

        not cover, the request is answered `200` with `verdict: deny` and the

        reason `unsupported_obligation` (ADR-065 invariant 8) - a decision about

        the request, not a transport error. That holds on every edition. An

        Enterprise deployment adds a second reason beginning

        `pep_capability_unsupported` naming the gap, and refuses a checksum

        validator''s mask on the MCP passes; a Community deployment hands that

        masked content over (#4257 split 2, #4122).

        '
      schema:
        type: string
        maxLength: 4096
        description: base64url (padding optional) of the PEPHandshake document.
    AxonflowClient:
      name: X-Axonflow-Client
      in: header
      required: false
      description: 'Optional client-version telemetry header (`<client>/<version>`,

        e.g. `mcp-proxy/0.3.1` or `claude-code/1.9.1`). Enterprise

        deployments with the `client_version_telemetry` capability count

        validated values in the `axonflow_client_version_requests_total`

        metric on the decide and MCP check-output planes. Telemetry only —

        never used for authentication or authorization; invalid values are

        ignored.

        '
      schema:
        type: string
        example: mcp-proxy/0.3.1
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: "OAuth2-style Basic authentication using `clientId:clientSecret` credentials.\n\n**Header format:** `Authorization: Basic base64(clientId:clientSecret)`\n\n- `clientId` (required): Your organization/client identifier\n- `clientSecret` (optional): Authentication credential. Optional for community/self-hosted mode.\n\n**Example:**\n```bash\n# With clientSecret (enterprise)\ncurl -H \"Authorization: Basic $(echo -n 'my-org:AXON-V2-xxx' | base64)\" ...\n\n# Without clientSecret (community mode)\ncurl -H \"Authorization: Basic $(echo -n 'my-org:' | base64)\" ...\n```\n\n## Per-user identity behind a shared credential\n\nThis credential authenticates an ORGANIZATION or client, not a person.\nBehind one such credential can sit many human principals, each\noptionally forwarding a **per-user token** that proves who they are.\nWhere that token is read depends on the envelope: the `user_token`\nfield of the request body on `POST /api/v1/decide` and the four MCP\nREST routes, and the `X-User-Token` header on the MCP-server JSON-RPC\nplane. The two spellings are deliberately not interchangeable.\n\n**A presented per-user token that fails to validate is a refused\naccess attempt, not a legacy caller** (`401`, audited\n`user_token_rejected`). It is never downgraded to a shared service\nidentity, so revocation, expiry, algorithm pinning and signature\nchecks take effect on every plane that reads one.\n\n**Whether presenting a token is REQUIRED is a per-organization\nposture, `require_user_token`, and it is off by default (#3476).**\nWith it off, an enterprise caller that presents no token at all is\nserved under a synthetic org-scoped service identity\n(`<client-id>@axonflow.local`, role `service`), which is the correct\nanswer for an infrastructure gateway acting as a Policy Enforcement\nPoint with no end-user token to forward. With it on, that caller is\nrefused at AUTHENTICATION, before any policy is evaluated (`401`,\naudited `user_token_required`).\n\nThe posture exists because a policy that names a PERSON - a\nprincipal-scoped constraint or permission in the organization's typed\ndocument (PRD v11 §1.6) - is only meaningful if a caller cannot CHOOSE\nto arrive without an identity: with the posture off such a policy\nstill applies to everyone who presents a token, but a caller can\ndecline to present one and be decided as the credential\n(`subject_type=Client`). Governance segments (ADR-060) decide on no\nagent route since v11.0.0 (#4253). Two levers set it, and an explicit\nper-organization row wins over the deployment-wide default in EITHER\ndirection:\n\n- `organizations.require_user_token`, per organization, default\n  `false`.\n- `AXONFLOW_REQUIRE_USER_TOKEN`, deployment-wide, default `false`.\n\nA posture change takes up to one cache window to become live\n(`AXONFLOW_REQUIRE_USER_TOKEN_TTL_SECONDS`, default 60 seconds,\nclamped to `[5, 600]`). A posture that cannot be READ resolves to\nREQUIRED rather than not-required, so a database outage cannot\nquietly switch the control off; a genuinely absent organization row\nis not a read failure and falls through to the deployment default.\n\n`POST /v1/chat/completions` is outside this guarantee: it mirrors\nOpenAI's wire shape and carries no per-user token field at all, so it\nkeeps the synthetic-identity fallback regardless of the posture.\nCommunity and community-SaaS deployments never reach any of the above.\n"
    InternalServiceID:
      type: apiKey
      in: header
      name: X-Internal-Service-ID
      description: 'Internal-service (operator lane) credential — **part one of two**.

        Must be sent together with `X-Internal-Service-Token`; either header

        alone is not a credential.


        This is the HMAC identity the Orchestrator and the Enterprise

        customer-portal use to call agent endpoints without holding a

        customer license. `apiAuthMiddleware` lifts both headers (plus an

        optional `X-Tenant-ID` scope) into `AuthHints`

        (`internalServiceHints` in `platform/agent/auth.go`) and

        `Authenticate()` validates them before any mode-specific auth

        (`platform/agent/authenticator.go:120-155`).


        Value: the service id, `orchestrator-internal`.


        ⚠️ An invalid or expired token is **not** an error by itself — it

        falls through to the deployment''s normal auth

        (`platform/agent/authenticator.go:153-154`). Send the internal-service

        headers on their own: paired with an `Authorization: Basic` header, a

        stale token silently yields a *tenant*-scoped answer that looks like a

        successful operator call.

        '
    InternalServiceToken:
      type: apiKey
      in: header
      name: X-Internal-Service-Token
      description: 'Internal-service (operator lane) credential — **part two of two**.

        Must be sent together with `X-Internal-Service-ID`.


        Format: `AXON-INTERNAL-{unix_ts}-{sig}`, where `sig` is the first 16

        hex characters of HMAC-SHA256 over `orchestrator-internal:{unix_ts}`

        keyed with `AXONFLOW_INTERNAL_SERVICE_SECRET`. Validated by

        `platform/shared/serviceauth` within a 5-minute clock-skew window, so

        it must be re-minted per session. See

        `technical-docs/runbooks/RUNBOOK_CONNECTOR_CONFIGURATION.md` for the

        exact minting snippet.

        '
