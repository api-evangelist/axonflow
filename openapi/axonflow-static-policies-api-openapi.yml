openapi: 3.2.0
info:
  title: AxonFlow Agent Static Policies API
  description: REST API for the AxonFlow Agent service - Authentication, Authorization, and Static Policy Enforcement Gateway.
  version: 11.1.0
  contact:
    name: AxonFlow Support
    url: https://getaxonflow.com/support
  license:
    name: Business Source License 1.1
    url: https://github.com/getaxonflow/axonflow/blob/main/LICENSE
servers:
- url: https://agent.getaxonflow.com
  description: Production (SaaS)
- url: https://axonflow.example.com
  description: Self-hosted deployment (agent single entry point, ADR-024)
- url: http://localhost:8080
  description: Local Development
tags:
- name: Static Policies
  description: 'DEPRECATED spelling of System Policies, served at

    `/api/v1/static-policies`.'
paths:
  /api/v1/static-policies:
    get:
      deprecated: true
      tags:
      - Static Policies
      summary: List static policies
      description: 'Returns static policies with three-tier hierarchy resolution:

        1. **System policies** - Managed by AxonFlow, immutable base

        2. **Organization policies** - Enterprise tier, organization-wide (Enterprise only)

        3. **Tenant policies** - Per-tenant customizations


        **v2.0.0 Categories** (semantic naming):

        - `security-sqli` - SQL injection detection (was: sql_injection)

        - `security-admin` - Admin access protection (was: admin_access)

        - `pii-global` - Global PII patterns (was: pii_detection)

        - `pii-us` - US-specific PII (SSN, etc.)

        - `pii-eu` - EU-specific PII (GDPR)

        - `pii-india` - India-specific PII (Aadhaar, PAN)

        - `custom` - Tenant-created policies


        Legacy category names are still accepted and automatically mapped.


        Part of ADR-019: Unified Policy Management System.'
      operationId: listStaticPolicies
      parameters:
      - name: Authorization
        in: header
        required: false
        description: 'Basic auth credentials: Basic base64(clientId:clientSecret). Required in evaluation/enterprise mode. Optional in community mode (defaults to community tenant).'
        schema:
          type: string
      - name: page
        in: query
        description: Page number (1-indexed)
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: page_size
        in: query
        description: Number of policies per page
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: category
        in: query
        description: 'Filter by policy category. New categories use semantic naming.

          Legacy names (sql_injection, pii_detection, etc.) are still accepted.

          '
        schema:
          type: string
          enum:
          - security-sqli
          - security-admin
          - pii-global
          - pii-us
          - pii-eu
          - pii-india
          - custom
          - sql_injection
          - pii_detection
          - dangerous_queries
          - admin_access
      - name: tier
        in: query
        description: Filter by policy tier
        schema:
          type: string
          enum:
          - system
          - organization
          - tenant
      - name: severity
        in: query
        description: Filter by severity level
        schema:
          type: string
          enum:
          - critical
          - high
          - medium
          - low
      - name: enabled
        in: query
        description: Filter by enabled status
        schema:
          type: boolean
      responses:
        '200':
          description: List of static policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticPoliciesListResponse'
        '400':
          description: Invalid request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      deprecated: true
      tags:
      - Static Policies
      summary: Create static policy
      description: 'Creates a new static policy for the tenant.


        **Tier restrictions:**

        - `system` tier: Cannot be created via API (managed by AxonFlow)

        - `organization` tier: Requires Enterprise license

        - `tenant` tier: Default, limited to 20 policies in Community mode


        Part of ADR-019: Unified Policy Management System.


        **v11:** on a deployment whose database connection cannot write

        `static_policies` (`migrations/core/172`), this route answers

        `409 LEGACY_POLICY_WRITE_FROZEN` before the request body is read,

        whatever it contains, naming the typed authoring route. An

        owner-role deployment still creates.'
      operationId: createStaticPolicy
      parameters:
      - name: Authorization
        in: header
        required: false
        description: 'Basic auth credentials: Basic base64(clientId:clientSecret). Required in evaluation/enterprise mode. Optional in community mode (defaults to community tenant).'
        schema:
          type: string
      - name: X-User-ID
        in: header
        required: false
        description: User ID for audit trail
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaticPolicyRequest'
            examples:
              customPII:
                summary: Create custom PII detection policy
                value:
                  name: Custom Employee ID Detection
                  description: Detects internal employee ID format
                  category: custom
                  tier: tenant
                  pattern: EMP-[0-9]{6}
                  action: warn
                  severity: medium
                  enabled: true
                  tags:
                  - custom
                  - pii
                  - employee
      responses:
        '201':
          description: Policy created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticPolicy'
        '400':
          description: Invalid request body or missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Operation forbidden (e.g., system tier creation, license required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/LegacyPolicyWriteFrozen'
  /api/v1/static-policies/effective:
    get:
      deprecated: true
      tags:
      - Static Policies
      summary: Get effective policies
      description: 'Returns all effective policies for a tenant with overrides applied.


        This endpoint resolves the three-tier hierarchy:

        1. System policies (base)

        2. Organization overrides (if any)

        3. Tenant overrides (if any)


        Used by the Customer Portal for the unified policy view.'
      operationId: getEffectivePolicies
      parameters:
      - name: Authorization
        in: header
        required: false
        description: 'Basic auth credentials: Basic base64(clientId:clientSecret). Required in evaluation/enterprise mode. Optional in community mode (defaults to community tenant).'
        schema:
          type: string
      responses:
        '200':
          description: Effective policies with overrides applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivePoliciesResponse'
        '400':
          description: Invalid request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/static-policies/test:
    post:
      deprecated: true
      tags:
      - Static Policies
      summary: Test regex pattern
      description: 'Tests a regex pattern against input strings without creating a policy.


        Useful for validating patterns before creating policies.

        Has a 5-second timeout to prevent ReDoS attacks.


        The pattern is compiled as written. The engine compiles a stored

        pattern in the SQL-injection and destructive-command categories

        case-insensitively, so for those categories prefix `(?i)` to test

        what the engine matches.'
      operationId: testStaticPolicyPattern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestPatternRequest'
            examples:
              singleInput:
                summary: Test against single input
                value:
                  pattern: \b[0-9]{3}-[0-9]{2}-[0-9]{4}\b
                  input: My SSN is 123-45-6789
              multipleInputs:
                summary: Test against multiple inputs
                value:
                  pattern: \b[0-9]{3}-[0-9]{2}-[0-9]{4}\b
                  inputs:
                  - My SSN is 123-45-6789
                  - No SSN here
                  - 'Another SSN: 987-65-4321'
      responses:
        '200':
          description: Pattern test results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestPatternResponse'
        '400':
          description: Invalid request body or pattern
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/static-policies/overrides:
    get:
      deprecated: true
      tags:
      - Static Policies
      summary: List policy overrides
      description: 'Lists all policy overrides for a tenant.


        Overrides allow Enterprise customers to modify system policy behavior

        (action, enabled status) without changing the underlying pattern.'
      operationId: listStaticPolicyOverrides
      parameters:
      - name: Authorization
        in: header
        required: false
        description: 'Basic auth credentials: Basic base64(clientId:clientSecret). Required in evaluation/enterprise mode. Optional in community mode (defaults to community tenant).'
        schema:
          type: string
      - name: include_expired
        in: query
        required: false
        description: Include expired overrides in results
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: List of policy overrides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyOverridesListResponse'
        '400':
          description: Invalid request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/static-policies/{id}:
    get:
      deprecated: true
      tags:
      - Static Policies
      summary: Get static policy by ID
      description: 'Returns a single static policy by its UUID.


        The policy ID is the `id` field from the static_policies table,

        not the `policy_id` (human-readable identifier like ''sql_injection_union'').'
      operationId: getStaticPolicy
      parameters:
      - name: Authorization
        in: header
        required: false
        description: 'Basic auth credentials: Basic base64(clientId:clientSecret). Required in evaluation/enterprise mode. Optional in community mode (defaults to community tenant).'
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: Static policy UUID
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Static policy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticPolicy'
        '400':
          description: Invalid request body or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      deprecated: true
      tags:
      - Static Policies
      summary: Update static policy
      description: 'Updates an existing static policy.


        **Restrictions:**

        - System-tier policies cannot be modified (use overrides instead)

        - Pattern changes trigger version increment


        **v11:** on a deployment whose database connection cannot write

        `static_policies` (`migrations/core/172`), this route answers

        `409 LEGACY_POLICY_WRITE_FROZEN` before the request body is read and

        before the policy is looked up, whatever it contains, naming the

        typed authoring route. An owner-role deployment still updates.'
      operationId: updateStaticPolicy
      parameters:
      - name: id
        in: path
        required: true
        description: Static policy UUID
        schema:
          type: string
          format: uuid
      - name: X-User-ID
        in: header
        required: false
        description: User ID for audit trail
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaticPolicyRequest'
      responses:
        '200':
          description: Policy updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticPolicy'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: System policies cannot be modified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/LegacyPolicyWriteFrozen'
    delete:
      deprecated: true
      tags:
      - Static Policies
      summary: Delete static policy
      description: 'Soft-deletes a static policy (sets deleted_at timestamp).


        **Restrictions:**

        - System-tier policies cannot be deleted'
      operationId: deleteStaticPolicy
      parameters:
      - name: id
        in: path
        required: true
        description: Static policy UUID
        schema:
          type: string
          format: uuid
      - name: X-User-ID
        in: header
        required: false
        description: User ID for audit trail
        schema:
          type: string
      responses:
        '204':
          description: Policy deleted successfully
        '403':
          description: System policies cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/LegacyPolicyWriteFrozen'
    patch:
      deprecated: true
      tags:
      - Static Policies
      summary: Toggle policy enabled status
      description: 'Toggles the enabled status of a policy.


        **Restrictions:**

        - System-tier policies cannot be disabled via this endpoint (use overrides)


        **v11:** on a deployment whose database connection cannot write

        `static_policies` (`migrations/core/172`), this route answers

        `409 LEGACY_POLICY_WRITE_FROZEN` before the request body is read and

        before the policy is looked up, whatever it contains, naming the

        typed authoring route. An owner-role deployment still toggles.'
      operationId: toggleStaticPolicy
      parameters:
      - name: id
        in: path
        required: true
        description: Static policy UUID
        schema:
          type: string
          format: uuid
      - name: X-User-ID
        in: header
        required: false
        description: User ID for audit trail
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
                  description: New enabled status
      responses:
        '200':
          description: Policy updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticPolicy'
        '403':
          description: System policies cannot be disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/LegacyPolicyWriteFrozen'
  /api/v1/static-policies/{id}/versions:
    get:
      deprecated: true
      tags:
      - Static Policies
      summary: Get policy version history
      description: 'Returns the version history for a policy.


        **Edition limits:**

        - Community: Last 5 versions

        - Enterprise: Unlimited history'
      operationId: getStaticPolicyVersions
      parameters:
      - name: id
        in: path
        required: true
        description: Static policy UUID
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        required: false
        description: 'Basic auth credentials: Basic base64(clientId:clientSecret). Required in evaluation/enterprise mode. Optional in community mode (defaults to community tenant).'
        schema:
          type: string
      responses:
        '200':
          description: Version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyVersionsResponse'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/static-policies/{id}/override:
    get:
      deprecated: true
      tags:
      - Static Policies
      summary: Get active override for a policy
      description: 'Returns the active override for a single policy (404 when none).

        `{id}` may be the policy UUID or the human-readable slug - slugs

        are resolved to the canonical UUID before lookup.'
      operationId: getStaticPolicyOverride
      parameters:
      - $ref: '#/components/parameters/LicenseKey'
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The active override
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyOverride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No override exists for this policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONError'
    post:
      deprecated: true
      tags:
      - Static Policies
      summary: Create policy override
      description: 'Retired in v11 (PRD v11 §1.5): a system control is enabled, disabled

        or re-actioned in the organization''s typed document, in its

        `system_controls` section, through `/api/v1/typed-policies`. This

        route writes nothing and does not read a body: it answers `409

        LEGACY_POLICY_WRITE_FROZEN` to every authenticated caller, in every

        edition. The ADR-044 session override writes answer the same refusal

        since v11.0.0 (#4252); the override reads are unaffected.'
      operationId: createStaticPolicyOverride
      parameters:
      - name: id
        in: path
        required: true
        description: Static policy UUID to override
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        required: false
        description: 'Basic auth credentials: Basic base64(clientId:clientSecret). Required in evaluation/enterprise mode. Optional in community mode (defaults to community tenant).'
        schema:
          type: string
      - name: X-User-ID
        in: header
        required: false
        description: User ID for audit trail
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOverrideRequest'
            examples:
              disablePolicy:
                summary: Disable a system policy
                value:
                  enabled_override: false
                  override_reason: False positive rate too high for this tenant
                  expires_at: '2025-06-01T00:00:00Z'
              changeAction:
                summary: Change action from block to warn
                value:
                  action_override: warn
                  override_reason: Regulatory requirement to warn instead of block
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/PerPolicyOverrideRetired'
    delete:
      deprecated: true
      tags:
      - Static Policies
      summary: Delete policy override
      description: 'Retired in v11 (PRD v11 §1.5): a system control is enabled, disabled

        or re-actioned in the organization''s typed document, in its

        `system_controls` section, through `/api/v1/typed-policies`. This

        route writes nothing and does not read a body: it answers `409

        LEGACY_POLICY_WRITE_FROZEN` to every authenticated caller, in every

        edition. The ADR-044 session override writes answer the same refusal

        since v11.0.0 (#4252); the override reads are unaffected.'
      operationId: deleteStaticPolicyOverride
      parameters:
      - name: id
        in: path
        required: true
        description: Static policy UUID
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        required: false
        description: 'Basic auth credentials: Basic base64(clientId:clientSecret). Required in evaluation/enterprise mode. Optional in community mode (defaults to community tenant).'
        schema:
          type: string
      - name: X-User-ID
        in: header
        required: false
        description: User ID for audit trail
        schema:
          type: string
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/PerPolicyOverrideRetired'
components:
  responses:
    Unauthorized:
      description: 'Missing or invalid authentication. Handler-written 401s use the

        `{success, error}` envelope; 401s written by the auth middleware

        use the `{"error": {"code", "message"}}` envelope (JSONError).

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: 'Authentication required: provide Authorization header with Basic auth (clientId:clientSecret)'
    PerPolicyOverrideRetired:
      description: 'Per-policy overrides of system controls are retired in v11 (PRD v11

        §1.5). A system control is enabled, disabled or re-actioned in the

        organization''s typed document, in its `system_controls` section,

        through the typed authoring route (`/api/v1/typed-policies`, in

        `orchestrator-api.yaml`). The route stays registered so a caller is

        told where the write went. It writes nothing, and it answers this in

        every edition and on every database role: `policy_overrides` is not

        revoked by core/172, and no route writes it in v11 (the session

        override writes answer the same refusal since #4252), so the refusal

        is the handler''s. The body is the

        `LegacyPolicyWriteFrozen` envelope: `JSONError` with `code` the string

        `LEGACY_POLICY_WRITE_FROZEN`.

        '
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - LEGACY_POLICY_WRITE_FROZEN
                  message:
                    type: string
          example:
            error:
              code: LEGACY_POLICY_WRITE_FROZEN
              message: 'Policy overrides are retired in v11: a policy is enabled, disabled or re-actioned in the organization''s typed document (a shipped system control in its system_controls section) through the typed authoring route at /api/v1/typed-policies. Reads on this endpoint are unaffected.'
    LegacyPolicyWriteFrozen:
      description: 'The legacy policy tables are read-only. `migrations/core/172` revoked

        INSERT, UPDATE, DELETE and TRUNCATE on `static_policies` from the

        application roles, and this endpoint writes it, so the write is

        refused permanently rather than transiently. It is not an entitlement

        fact: no licence, edition or upgrade changes it. Author policies

        through the typed authoring route (`/api/v1/typed-policies`, in

        `orchestrator-api.yaml`) instead. Reads are unaffected. A deployment

        whose connection may still write the table (the database owner; a

        property of the connection, not of `AXONFLOW_DB_USE_APP_ROLE` alone)

        is not bound by the revoke and does not receive this response. The body

        is the `JSONError` envelope with `code` as the string

        `LEGACY_POLICY_WRITE_FROZEN` rather than the numeric status.

        '
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - LEGACY_POLICY_WRITE_FROZEN
                  message:
                    type: string
          example:
            error:
              code: LEGACY_POLICY_WRITE_FROZEN
              message: 'The legacy policy tables are read-only in v11: migrations/core/172 revoked write access from the application role, and this endpoint writes them. Author policies through the typed authoring route at /api/v1/typed-policies instead. Reads on this endpoint are unaffected.'
  schemas:
    ErrorResponse:
      type: object
      description: 'Handler-written error envelope. Note the agent has a second error

        envelope for middleware-written errors (see JSONError) — clients

        should tolerate both shapes on 4xx/5xx.

        '
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message
    CreateStaticPolicyRequest:
      type: object
      description: Request body for creating a static policy
      required:
      - name
      - pattern
      - category
      - action
      properties:
        name:
          type: string
          description: Display name of the policy
          example: Custom Employee ID Detection
        description:
          type: string
          description: Detailed policy description
        category:
          type: string
          enum:
          - security-sqli
          - security-admin
          - pii-global
          - pii-us
          - pii-eu
          - pii-india
          - custom
          description: Policy category
        tier:
          type: string
          enum:
          - organization
          - tenant
          description: Policy tier (system not allowed via API). Default is tenant.
          default: tenant
        pattern:
          type: string
          description: Regex pattern for detection
          example: EMP-[0-9]{6}
        action:
          type: string
          enum:
          - block
          - require_approval
          - redact
          - warn
          - log
          description: Action to take when pattern matches
        severity:
          type: string
          enum:
          - critical
          - high
          - medium
          - low
          description: Severity level
        priority:
          type: integer
          description: Priority order (lower = higher priority)
          default: 100
        enabled:
          type: boolean
          description: Whether the policy is active
          default: true
        tags:
          type: array
          items:
            type: string
          description: Tags for categorization
    PolicyOverride:
      type: object
      description: Override configuration for system policies (Enterprise only)
      properties:
        id:
          type: string
          description: Override identifier
        policy_id:
          type: string
          description: ID of the policy being overridden
        policy_type:
          type: string
          enum:
          - static
          - dynamic
          description: Type of policy being overridden
        tenant_id:
          type: string
          description: Tenant ID for tenant-level overrides
        enabled_override:
          type: boolean
          description: Override enabled status (null = no override)
        action_override:
          type: string
          enum:
          - block
          - require_approval
