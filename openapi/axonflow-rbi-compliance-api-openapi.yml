openapi: 3.2.0
info:
  title: Axonflow RBI Compliance API
  version: 11.1.0
  contact:
    name: AxonFlow Support
    url: https://getaxonflow.com/support
  license:
    name: Business Source License 1.1
    url: https://github.com/getaxonflow/axonflow/blob/main/LICENSE
  description: 'Operations tagged RBI Compliance across 2 of this provider''s published API definitions: axonflow-orchestrator-api.yaml, axonflow-orchestrator-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://orchestrator.getaxonflow.com
  description: Production (SaaS)
- url: http://localhost:8081
  description: Local Development
tags:
- name: RBI Compliance
  description: 'RBI FREE-AI Framework compliance for Indian banking institutions.

    Enterprise feature providing AI System Registry, Model Validation,

    Incident Management, Kill Switch, Board Reporting, and Audit Export.'
paths:
  /api/v1/rbi/dashboard:
    get:
      tags:
      - RBI Compliance
      summary: Get RBI compliance dashboard
      description: Returns RBI FREE-AI Framework compliance dashboard with module health status.
      operationId: getRBIDashboard
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  module:
                    type: string
                  components:
                    type: object
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/ai-systems:
    get:
      tags:
      - RBI Compliance
      summary: List AI systems
      description: 'List all registered AI systems for the organization.

        Per RBI FREE-AI: All AI systems must be registered with board approval.'
      operationId: listAISystems
      parameters:
      - name: risk_category
        in: query
        schema:
          type: string
          enum:
          - low
          - medium
          - high
      - name: deployment_status
        in: query
        schema:
          type: string
          enum:
          - development
          - sandbox
          - canary
          - production
          - deprecated
      responses:
        '200':
          description: List of AI systems
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RBIAISystem'
    post:
      tags:
      - RBI Compliance
      summary: Register AI system
      description: Register a new AI system in the RBI compliance registry.
      operationId: createAISystem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RBIAISystemCreate'
      responses:
        '201':
          description: AI system created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RBIAISystem'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/ai-systems/{id}:
    get:
      tags:
      - RBI Compliance
      summary: Get AI system
      operationId: getAISystem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: AI system details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RBIAISystem'
    patch:
      tags:
      - RBI Compliance
      summary: Update AI system
      description: 'Partial update: only the members present in the body are applied.


        PATCH, not PUT. Until #3935 this operation was documented as PUT and

        registered as PUT, and the handler implemented only PATCH - so the

        published contract and the router agreed with each other, both

        disagreed with the code, and every update answered 405.'
      operationId: updateAISystem
      parameters:
      - name: id
        in: path
        required: true
        description: The AI system's identifier.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RBIAISystemCreate'
      responses:
        '200':
          description: AI system updated
    delete:
      tags:
      - RBI Compliance
      summary: Delete AI system
      operationId: deleteAISystem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: AI system deleted
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/validations:
    get:
      tags:
      - RBI Compliance
      summary: List model validations
      description: List model validation records per RBI FREE-AI Section 3.2.
      operationId: listValidations
      responses:
        '200':
          description: List of validations
    post:
      tags:
      - RBI Compliance
      summary: Create validation record
      operationId: createValidation
      responses:
        '201':
          description: Validation created
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/incidents:
    get:
      tags:
      - RBI Compliance
      summary: List AI incidents
      description: List AI incidents per RBI FREE-AI incident management requirements.
      operationId: listIncidents
      responses:
        '200':
          description: List of incidents
    post:
      tags:
      - RBI Compliance
      summary: Report AI incident
      operationId: createIncident
      responses:
        '201':
          description: Incident created
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/killswitches:
    get:
      tags:
      - RBI Compliance
      summary: List kill switches
      description: List active and inactive kill switches for emergency AI disable.
      operationId: listKillSwitches
      responses:
        '200':
          description: List of kill switches
    post:
      tags:
      - RBI Compliance
      summary: Activate kill switch
      description: 'Emergency kill switch activation per RBI FREE-AI guidelines.

        Immediately halts all AI operations for specified scope.'
      operationId: activateKillSwitch
      responses:
        '201':
          description: Kill switch activated
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/killswitches/{id}/deactivate:
    post:
      tags:
      - RBI Compliance
      summary: Deactivate kill switch
      operationId: deactivateKillSwitch
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Kill switch deactivated
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/reports:
    get:
      tags:
      - RBI Compliance
      summary: List board reports
      description: List board reports per RBI FREE-AI Section 6.1 requirements.
      operationId: listBoardReports
      responses:
        '200':
          description: List of reports
    post:
      tags:
      - RBI Compliance
      summary: Generate board report
      operationId: createBoardReport
      responses:
        '201':
          description: Report generation started
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/audit-exports:
    get:
      tags:
      - RBI Compliance
      summary: List audit exports
      description: List audit exports with retention per RBI FREE-AI requirements.
      operationId: listAuditExports
      parameters:
      - name: X-Org-ID
        in: header
        required: true
        description: 'Organization scope for this request. Stamped by the AxonFlow Agent

          gateway from the cryptographically validated client credential

          (Set, not Add, so any client-supplied value is overwritten), so it

          is not client-selectable and carries no cross-org override

          capability on this route. The orchestrator fails closed with 401

          when it is absent or blank; there is no query-string equivalent.

          '
        schema:
          type: string
        example: travel-us
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: List of exports
          content:
            application/json:
              schema:
                type: object
                properties:
                  exports:
                    type: array
                    items:
                      $ref: '#/components/schemas/RBIAuditExport'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
    post:
      tags:
      - RBI Compliance
      summary: Create audit export
      description: 'Create a new RBI audit export. Supports full or incremental exports in JSON, CSV, or XML format.

        When cloud storage is configured, exports are uploaded to S3/GCS/Azure and a presigned download URL is generated.'
      operationId: createAuditExport
      parameters:
      - name: X-Org-ID
        in: header
        required: true
        description: 'Organization scope for this request. Stamped by the AxonFlow Agent

          gateway from the cryptographically validated client credential

          (Set, not Add, so any client-supplied value is overwritten), so it

          is not client-selectable and carries no cross-org override

          capability on this route. The orchestrator fails closed with 401

          when it is absent or blank; there is no query-string equivalent.

          '
        schema:
          type: string
        example: travel-us
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RBIAuditExportRequest'
            example:
              export_type: full
              format: json
              requested_by: compliance-officer
              purpose: Quarterly RBI audit
      responses:
        '201':
          description: Export created
          content:
            application/json:
              schema:
                type: object
                properties:
                  export:
                    $ref: '#/components/schemas/RBIAuditExport'
        '400':
          $ref: '#/components/responses/CodedBadRequest'
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/audit-exports/{export_id}:
    get:
      tags:
      - RBI Compliance
      summary: Get audit export status
      description: Get the status and details of a specific audit export.
      operationId: getAuditExport
      parameters:
      - name: export_id
        in: path
        required: true
        schema:
          type: string
      - name: X-Org-ID
        in: header
        required: true
        description: 'Organization scope for this request. Stamped by the AxonFlow Agent

          gateway from the cryptographically validated client credential

          (Set, not Add, so any client-supplied value is overwritten), so it

          is not client-selectable and carries no cross-org override

          capability on this route. The orchestrator fails closed with 401

          when it is absent or blank; there is no query-string equivalent.

          '
        schema:
          type: string
        example: travel-us
      responses:
        '200':
          description: Export details
          content:
            application/json:
              schema:
                type: object
                properties:
                  export:
                    $ref: '#/components/schemas/RBIAuditExport'
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '404':
          $ref: '#/components/responses/CodedNotFound'
    delete:
      tags:
      - RBI Compliance
      summary: Delete audit export
      description: Delete an audit export and its associated cloud storage object.
      operationId: deleteAuditExport
      parameters:
      - name: export_id
        in: path
        required: true
        schema:
          type: string
      - name: X-Org-ID
        in: header
        required: true
        description: 'Organization scope for this request. Stamped by the AxonFlow Agent

          gateway from the cryptographically validated client credential

          (Set, not Add, so any client-supplied value is overwritten), so it

          is not client-selectable and carries no cross-org override

          capability on this route. The orchestrator fails closed with 401

          when it is absent or blank; there is no query-string equivalent.

          '
        schema:
          type: string
        example: travel-us
      responses:
        '204':
          description: Export deleted
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '404':
          $ref: '#/components/responses/CodedNotFound'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/audit-exports/{export_id}/process:
    post:
      tags:
      - RBI Compliance
      summary: Process audit export
      description: 'Trigger processing of a pending audit export. Generates the export file,

        uploads to cloud storage (if configured), and generates a presigned download URL.'
      operationId: processAuditExport
      parameters:
      - name: export_id
        in: path
        required: true
        schema:
          type: string
      - name: X-Org-ID
        in: header
        required: true
        description: 'Organization scope for this request. Stamped by the AxonFlow Agent

          gateway from the cryptographically validated client credential

          (Set, not Add, so any client-supplied value is overwritten), so it

          is not client-selectable and carries no cross-org override

          capability on this route. The orchestrator fails closed with 401

          when it is absent or blank; there is no query-string equivalent.

          '
        schema:
          type: string
        example: travel-us
      responses:
        '200':
          description: Export processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  export:
                    $ref: '#/components/schemas/RBIAuditExport'
        '400':
          $ref: '#/components/responses/CodedBadRequest'
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '404':
          $ref: '#/components/responses/CodedNotFound'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/policies/templates:
    get:
      tags:
      - RBI Compliance
      summary: List RBI policy templates
      description: List pre-built RBI FREE-AI compliance policy templates.
      operationId: listRBIPolicyTemplates
      responses:
        '200':
          description: List of policy templates
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/ai-systems/summary:
    get:
      tags:
      - RBI Compliance
      summary: AI system registry summary
      operationId: getRBIAISystemSummary
      parameters:
      - name: X-Org-ID
        in: header
        required: true
        description: Organization scope. The orchestrator fails closed with 401 when it is absent or blank.
        schema:
          type: string
      responses:
        '200':
          description: Registry summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RBIAISystemSummary'
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '500':
          $ref: '#/components/responses/CodedInternalError'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/validations/{id}:
    get:
      tags:
      - RBI Compliance
      summary: Get a model validation
      description: Reads one RBI FREE-AI model validation record by its identifier.
      operationId: getRBIValidation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: X-Org-ID
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The model validation
          content:
            application/json:
              schema:
                type: object
                description: 'RBI model validation record. The full member set is large and

                  evolves with the RBI FREE-AI schedule; it is not enumerated

                  here.

                  '
                additionalProperties: true
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '404':
          $ref: '#/components/responses/CodedNotFound'
    patch:
      tags:
      - RBI Compliance
      summary: Update a model validation
      description: 'Partial update: only the members present in the body are applied.


        PATCH, not PUT. Until #3935 this path registered PUT, which no handler

        implements, so every update answered 405 and this operation was

        unreachable by any verb.'
      operationId: updateRBIValidation
      parameters:
      - name: id
        in: path
        required: true
        description: The model validation's identifier.
        schema:
          type: string
      - name: X-Org-ID
        in: header
        required: true
        description: Organization scope. The orchestrator fails closed with 401 when it is absent or blank.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Members of the validation record to change. Absent members are

                left as they are.

                '
              additionalProperties: true
      responses:
        '200':
          description: The updated model validation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/CodedBadRequest'
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '404':
          $ref: '#/components/responses/CodedNotFound'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/incidents/{id}:
    get:
      tags:
      - RBI Compliance
      summary: Get an AI incident
      description: Reads one RBI FREE-AI incident record by its identifier.
      operationId: getRBIIncident
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: X-Org-ID
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The AI incident
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '404':
          $ref: '#/components/responses/CodedNotFound'
    patch:
      tags:
      - RBI Compliance
      summary: Update an AI incident
      description: 'Partial update: only the members present in the body are applied.


        This operation does NOT change the incident''s status. Status is a

        lifecycle transition rather than a field edit; the terminal one is

        `POST /api/v1/rbi/incidents/{id}/resolve`.


        PATCH, not PUT — see the note on `PATCH /api/v1/rbi/validations/{id}`.'
      operationId: updateRBIIncident
      parameters:
      - name: id
        in: path
        required: true
        description: The incident's identifier.
        schema:
          type: string
      - name: X-Org-ID
        in: header
        required: true
        description: Organization scope. The orchestrator fails closed with 401 when it is absent or blank.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Members of the incident record to change. Absent members are

                left as they are.

                '
              additionalProperties: true
      responses:
        '200':
          description: The updated AI incident
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/CodedBadRequest'
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '404':
          $ref: '#/components/responses/CodedNotFound'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/incidents/{id}/resolve:
    post:
      tags:
      - RBI Compliance
      summary: Resolve an AI incident
      description: 'Moves the incident to `resolved`, stamps `resolved_at`, and records the

        resolution summary.


        `resolution` is required. This operation is the only writer of

        `resolution_summary` on an incident record — `PATCH

        /api/v1/rbi/incidents/{id}` does not carry the field — so an incident

        resolved without one could never acquire it afterwards.


        Registered since the module''s first release and unserved until #3935:

        the handler''s sub-route switch had no case for `resolve`, so every

        request answered 405.'
      operationId: resolveRBIIncident
      parameters:
      - name: id
        in: path
        required: true
        description: The incident's identifier.
        schema:
          type: string
      - name: X-Org-ID
        in: header
        required: true
        description: Organization scope. The orchestrator fails closed with 401 when it is absent or blank.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - resolution
              properties:
                resolution:
                  type: string
                  minLength: 1
                  description: How the incident was resolved. Stored as `resolution_summary`.
      responses:
        '200':
          description: The resolved AI incident
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/CodedBadRequest'
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '404':
          $ref: '#/components/responses/CodedNotFound'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/killswitches/{id}:
    get:
      tags:
      - RBI Compliance
      summary: Get a kill switch
      operationId: getRBIKillSwitch
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: X-Org-ID
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The kill switch
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '404':
          $ref: '#/components/responses/CodedNotFound'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/reports/{id}:
    get:
      tags:
      - RBI Compliance
      summary: Get a board report
      description: 'Only GET is served on this path, and that is the whole of it.


        There is no update-report operation here under any verb: a board

        report''s mutations are the `/submit`, `/approve` and `/reject`

        sub-routes. Deletion is implemented in the handler and deliberately not

        registered — whether an RBI FREE-AI board report may be destroyed over

        the API is a retention decision, tracked separately.'
      operationId: getRBIBoardReport
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: X-Org-ID
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The board report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '404':
          $ref: '#/components/responses/CodedNotFound'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/reports/{id}/submit:
    post:
      tags:
      - RBI Compliance
      summary: Submit a board report for approval
      operationId: submitRBIBoardReport
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: X-Org-ID
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The submitted board report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/CodedBadRequest'
        '401':
          $ref: '#/components/responses/CodedUnauthorized'
        '404':
          $ref: '#/components/responses/CodedNotFound'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/rbi/audit-exports/{export_id}/download:
    get:
      tags:
      - RBI Compliance
      summary: Download an RBI audit export
      description: 'TWO MUTUALLY EXCLUSIVE OUTCOMES, and a client must handle both. When

        cloud storage is configured the response is a 307 redirect to a

