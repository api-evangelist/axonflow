            type:
              type: string
            qualifier:
              type: string
            local:
              type: string
        at:
          type: string
          format: date-time
          description: When the activation was recorded, in UTC.
        reason:
          type: string
          description: 'The reason the actor gave. A withdrawal and a rollback both require one:

            an unexplained return to the shipped set wants explaining as much as a

            rollback does.


            Free text, read by audit. When the activation acknowledged organization

            template omissions (`acknowledge_template_omissions`), the accepted ids

            are recorded here, sorted, as `[acknowledged template omissions: a, b]`

            after the actor''s reason (or alone, for a promotion given no reason).

            '
    TemplateOmissionReport:
      type: object
      description: 'Which of the organization template''s policies a document does not carry, or

        carries changed. The document an organization activates REPLACES the implicit

        bundle''s template, so each policy it omits or changes stops deciding as

        shipped for that organization; publish and activation return this report so

        that dropping or editing a template control is a visible edit rather than a

        silent one.


        It counts POLICIES, not controls: a template redaction ships as two policies

        bound by discharge, and a document carrying only one of them drops the

        control on the other''s scopes.

        '
      properties:
        omitted:
          type: array
          items:
            type: string
          description: The template policy identifiers this document does not carry.
        modified:
          type: array
          items:
            type: string
          description: 'The template policy identifiers this document carries under their id but

            not as shipped: the policy differs (compared as canonical JSON), or an

            attribute it reads is declared with another type, optionality or

            freshness bound, or not declared. Disjoint from `omitted`; an activation

            acknowledges both.

            '
        of:
          type: integer
          description: How many policies the organization template ships.
        message:
          type: string
          description: The same fact as a sentence, naming each omitted and each changed policy, and each changed attribute with what differs.
    AuthoringFinding:
      type: object
      description: One declared save-time or publication result.
      properties:
        code:
          type: string
        severity:
          type: string
          enum:
          - reject
          - warn
        policy_id:
          type: string
        summary:
          type: string
          description: The declared, code-level sentence, renderable verbatim.
        detail:
          type: string
          description: What was wrong in this document, naming the offending value.
    EditionConstructReport:
      type: object
      description: 'What this edition may spend. Derived from the edition profile, whose

        every row cites a row of the Edition Capability Boundaries PRD.

        '
      properties:
        edition:
          type: string
          enum:
          - community
          - evaluation
          - enterprise
        obligation_families:
          type: array
          description: 'The obligation families this edition may attach. Community and

            Evaluation carry disclosure and audit/notify; route restriction is

            Evaluation and above; approval and budget are Enterprise.

            '
          items:
            type: string
        attribute_namespaces:
          type: array
          description: 'The request-context attribute namespaces a condition may read.

            Community carries `principal`, `action`, `resource` and `args`;

            Evaluation adds `env` and `signal`; Enterprise adds `agent` and

            `state`.

            '
          items:
            type: string
        group_scope:
          type: boolean
          description: 'Whether a policy may be scoped to a group. Group scope resolves

            through the nested group graph, which is Enterprise.

            '
        separation_of_duties:
          type: boolean
          description: 'Whether a publication needs an approver other than the author and an

            activation an actor other than that author. True on Enterprise, and

            true on ANY edition when `tier_established` is false. Where it is

            false, a sole administrator can publish and activate; nothing else

            is relaxed, and every activation is still attributed and audited.

            '
        tier_established:
          type: boolean
          description: 'Whether this process could DETERMINE the deployment''s licensed

            tier, or fell back to Community because it could not. False means

            either that a licence key was present and did not verify, or that

            none reached this process on a deployment whose `DEPLOYMENT_MODE`

            is entitled to Enterprise.


            When it is false the two fields above disagree on purpose:

            `edition` reads `community`, because losing a construct loses a

            capability and the smallest boundary is the safe fallback for one;

            `separation_of_duties` reads true regardless, because losing an

            approver loses a control and the smallest boundary is the

            PERMISSIVE one there. Read together they say "this deployment may

            be entitled to more than it is being given, and nothing is being

            relaxed while that is unresolved". The remedy is an operator''s:

            give this process `AXONFLOW_LICENSE_KEY`, or re-issue the licence.

            '
        reserved:
          type: array
          description: 'Constructs withheld for want of an edition ruling rather than by

            one, reported separately because an excluded construct is an upgrade

            and a reserved one is an open question.

            '
          items:
            type: string
    TypedAuthoringDocumentRequest:
      type: object
      required:
      - document
      description: 'A candidate document and the author-declared fixtures the publication

        gauntlet runs against it. A publication with no fixtures is refused by

        name: no policy in the document has been shown to do anything.

        '
      properties:
        document:
          type: object
          description: 'An `authoring.axonflow.com/v1` document. It is the authoring model

            itself rather than a mirror of it, so a field added to the policy

            vocabulary is authorable here without this schema changing. Its

            members are `api_version`, `metadata`, `policy` and, optionally,

            `system_controls` (PRD v11 §1.5), and every member the author sent is

            validated and signed. `GET /api/v1/typed-policies/schema` serves the

            JSON schema of all of them.

            '
        fixtures:
          type: array
          items:
            type: object
    ErrorResponse:
      type: object
      description: 'The FLAT error envelope: `{success, error}`. This is what

        `sendErrorResponse` emits, which is the orchestrator''s dominant error

        writer (240 call sites), so it is the shape of every error from the

        core request, audit, plan, workflow, execution and connector surfaces.


        It is one of THREE error SHAPES this document describes. See

        `CodedErrorResponse` and `TripletErrorResponse` for the other two, and

        the note on `components.responses` for why there is more than one.

        `LLMProviderAPIError` is a code-constrained refinement of the coded

        shape, not a fourth shape.


        This paragraph said "TWO" until issue #3941. `TripletErrorResponse` was

        added by the #3901 reconciliation and this sentence was not updated with

        it, so the document undercounted its own families — which is the same

        defect one level up as the operations that named the wrong one.

        '
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Human-readable message. There is no machine-readable code on this envelope.
      required:
      - success
      - error
  parameters:
