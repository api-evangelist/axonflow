components:
  responses:
    Unauthorized:
      description: 'Unauthorized - missing or invalid tenant/organization scope.


        NOTE: this is the FLAT-family member. Before #3901 it described the

        coded shape while its siblings described the flat one, so any operation

        referencing it alongside BadRequest documented two incompatible bodies.

        Operations whose handler emits the coded shape now reference

        CodedUnauthorized instead.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: missing tenant ID
    TypedAuthoringUnavailable:
      description: "The typed-authoring route cannot answer. `reason` says why:\n\n- `catalog_not_configured`: this deployment's typed-authoring\n  vocabulary could not be resolved, as `TypedAuthoringUnconfigured`\n  describes.\n- `storage_unavailable`: this deployment has a database configured for\n  typed authoring and could not use it. A publish or an activation is\n  refused rather than kept in memory, where the next restart would lose\n  it; a read of the active document is refused rather than answered\n  `404 nothing_active` (#4255), which would say the organization has no\n  active document. Retry once the database is reachable. The store's own\n  error is logged, never returned. A store that fails DURING a publish\n  or an activation, after the route was built, answers here too\n  (#4283), never `422 publication_refused` or `409 activation_refused`,\n  which are refusals of the document or the activation itself.\n- `ledger_inconsistent` (since v11.1.0, #4249 row 5797853828): the\n  store does not hold the active document its own ledger names. It is\n  the store's failure, like `storage_unavailable`, but a retry will not\n  heal it: the database is reachable and disagrees with itself, and the\n  store needs an operator's repair. An activation reads that document to\n  replace it, so `POST /activate` answers this; so do the reads of the\n  active document (`GET /active`, `GET /active/summary`), never `404\n  nothing_active` or a count of the shipped set alone, which would report\n  the organization's own controls as absent. Until v11.1.0 this state\n  answered `storage_unavailable`.\n- `workspace_building` (since v11.1.0, #4283): this request stopped\n  waiting for its organization's workspace build, which another request\n  started and which is still running. Retry in a few seconds. The step\n  the build was on is logged.\n- `workspace_unavailable` is answered with **500**, not 503, since\n  v11.1.0 (#4283), as the customer portal answers it: this\n  organization's typed-authoring workspace could not be built on this\n  process (a signing key that could not be generated, an authoring plane\n  or an activation authority that could not be constructed, a build\n  that did not complete), and a retry will not change that. A durable\n  store that cannot be opened is never this: it is\n  `storage_unavailable`. The cause is logged, never returned. A\n  `429 workspace_limit` on the same routes is the one quota: the\n  process holds its cap of workspaces and none can be evicted.\n- `key_not_loaded` (`GET /api/v1/typed-policies/active`, #4255, and\n  `POST /api/v1/typed-policies/activate`, where it is the artifact being\n  activated, #4249): the document is signed by a key this replica has not loaded,\n  and the reload that would load it did not complete in time. A read\n  whose key reload is deferred WAITS for it (at most a reload in flight\n  it joins, one reload floor of 2 seconds, plus one more floor for the\n  fresh reload it then runs or joins) and answers from the key set that\n  reload produced: `200`, `500 active_unverifiable` (on\n  activate, `500 artifact_unverifiable`) when the key is authorized\n  nowhere, or `503 storage_unavailable` when the re-read failed\n  (#4272). `key_not_loaded` is left for a reload in flight that took\n  longer than the floor; a retry after a few seconds settles it.\n"
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              reason:
                type: string
                enum:
                - catalog_not_configured
                - storage_unavailable
                - ledger_inconsistent
                - workspace_building
                - key_not_loaded
              error:
                type: string
    TypedAuthoringTierLimit:
      description: 'The edition''s customer-authored document ceiling. 402 rather than 429

        because a tier limit is a commercial ceiling and not a rate: the caller

        has nothing to wait for.


        The same status and the same `code` also carry the retryable OUTAGE

        refusal, when the admission ledger cannot be reached. `Retry-After` is

        what separates them, and the message says which applied.

        '
      headers:
        Retry-After:
          description: Present only on the retryable (ledger unreachable) refusal.
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              reason:
                type: string
                enum:
                - tier_limit
              code:
                type: string
                example: ERR_TIER_LIMIT_ORG_ROOT_POLICY
              error:
                type: string
              policy:
                type: string
                description: 'The policy that crossed the ceiling, present only on a refusal that names

                  one. A batch admission is all-or-nothing, so this is the first policy of

                  the submitted set that did not fit; it is absent on the outage refusal,

                  where no particular policy is at fault.

                  '
    TypedAuthoringUnconfigured:
      description: 'This deployment''s typed-authoring vocabulary could not be resolved: an

        unrecognised `AXONFLOW_TYPED_AUTHORING_CATALOG` value, or a deployment

        vocabulary this process could not build. Unset means `deployment` (PRD

        §1.5), so a stock deployment never answers this. The surface refuses

        rather than validating against an empty catalog, which would reject

        every policy for naming an unregistered action.

        '
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              reason:
                type: string
                enum:
                - catalog_not_configured
              error:
                type: string
  schemas:
    TypedAuthoringActivation:
      type: object
      description: 'One activation record. Promote, rollback and withdraw each append one, and

        the history is the chain they form.

        '
      properties:
        kind:
          type: string
          description: Which activation this is - a promote, a rollback or a withdrawal.
        root:
          type: string
          description: The authority root the activation applies to.
        digest:
          type: string
          description: 'The artifact digest activated. An activation names a DIGEST and never a

            version number, so "which policy produced this decision" survives the

            next edit.

            '
        previous_digest:
          type: string
          description: 'The entry this activation chains onto: the digest the previous

            activation named. Absent on the first activation an organization

            performs. It is what makes the history a chain rather than a list.


            A promotion and a rollback chain onto the ledger''s TIP; a withdrawal

            names the document it removes, which is the active one. The tip and

            the active digest differ only after a withdrawal, which appends an

            entry naming the shipped organization template while leaving nothing

            active - so the promotion after a withdrawal chains onto that entry

            rather than onto a document.

            '
        document_id:
          type: string
          description: The document identifier the activated artifact carries.
        document_version:
          type: integer
          description: 'The activated document''s own version. A rollback re-activates an earlier

            version and does NOT advance it.

            '
