openapi: 3.2.0
info:
  title: Axonflow Typed Policy Authoring API
  version: 11.1.0
  contact:
    name: AxonFlow Support
    url: https://getaxonflow.com/support
  license:
    name: Business Source License 1.1
    url: https://github.com/getaxonflow/axonflow/blob/main/LICENSE
  description: 'Operations tagged Typed Policy Authoring across 2 of this provider''s published API definitions: axonflow-orchestrator-api.yaml, axonflow-orchestrator-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://orchestrator.getaxonflow.com
  description: Production (SaaS)
- url: http://localhost:8081
  description: Local Development
tags:
- name: Typed Policy Authoring
  description: 'The ADR-065 typed policy authoring surface, available on EVERY edition

    (#3907).'
paths:
  /api/v1/typed-policies/edition:
    get:
      tags:
      - Typed Policy Authoring
      summary: What this deployment may author
      description: 'Reports the edition''s construct boundary and its customer-authored

        document ceiling. A deployment with no console has nothing else to read

        the boundary from, so this exists to be consulted BEFORE a publication

        rather than after a refusal.


        `reserved` names constructs withheld for want of an edition ruling

        rather than by one. The two have different remedies - an excluded

        construct is an upgrade, a reserved one is an open question - so they

        are reported separately rather than folded together.'
      operationId: getTypedAuthoringEdition
      parameters:
      - $ref: '#/components/parameters/TypedAuthoringOrg'
      - $ref: '#/components/parameters/TypedAuthoringUser'
      responses:
        '200':
          description: The edition boundary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  catalog:
                    type: string
                    description: The configured authoring vocabulary
                    example: conformance
                  catalog_digest:
                    type: string
                    description: 'The vocabulary''s IDENTITY rather than its name: the digest over the

                      authoring view''s actions, realms and resource types. Two snapshots with

                      equal digests admit and refuse the same policies, and an author reading a

                      refusal needs to know which snapshot refused them.

                      '
                  registry_version:
                    type: integer
                    format: int64
                    description: 'The action and tool registry version this vocabulary carries. It is the

                      same integer the wire carries as a decision snapshot''s registry_version

                      and a proof binding''s tool registry version.

                      '
                  catalog_fixture:
                    type: boolean
                    description: 'True when the vocabulary is a test world rather than the deployment''s

                      own. Production activation refuses a fixture snapshot.

                      '
                  root:
                    type: string
                    enum:
                    - organization
                    description: 'The one authority root this surface publishes under. It is

                      fixed and is NOT the edition boundary.

                      '
                  max_documents:
                    type: integer
                    description: 'Customer-authored documents this edition admits per

                      organization. -1 is unlimited.

                      '
                    example: 20
                  constructs:
                    $ref: '#/components/schemas/EditionConstructReport'
                  persistence:
                    type: string
                    enum:
                    - process
                    - database
                    - unavailable
                    description: 'Where a publication by THIS organization is kept.


                      `database` means the artifact and its activation history

                      are in postgres and outlive the process and the replica.


                      `process` means they live in this orchestrator process

                      only and do not survive a restart. It is the honest answer

                      for a deployment with no database configured, which is a

                      supported posture.


                      `unavailable` means this deployment HAS a database

                      configured for typed authoring and could not reach it.

                      Writes are refused with 503 `storage_unavailable` rather

                      than accepted into a store that cannot keep them, and so

                      is the read of the active document, which the in-process

                      view cannot answer (#4255); the other reads, this one

                      included, are still served. It is reported

                      separately from `process` because an outage is not a

                      design choice, and a deployment promised durability that

                      is not getting it must not read like one that never had

                      it.


                      Derived from the workspace the organization actually has,

                      through the same call a publish makes, so it reports the

                      posture a write would really get. It is the same field,

                      with the same two values, that the customer portal''s

                      settings endpoint reports, so one deployment reads the

                      same way through either surface.

                      '
                    example: database
                  signing_key_custody:
                    type: string
                    enum:
                    - process
                    description: 'Where the PRIVATE half of the signing key lives, and it is

                      reported separately from `persistence` because it is a

                      different fact.


                      It is `process` even when `persistence` is `database`:

                      each process mints its own key and records only the public

                      half, so a restart cannot invalidate what was already

                      signed - every authorized public key is loaded back - and

                      also cannot re-sign with the old key. Conflating the two

                      would overstate what durability buys. A durable signing

                      identity is tracked separately.

                      '
                    example: process
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/TypedAuthoringUnconfigured'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/typed-policies/validate:
    post:
      tags:
      - Typed Policy Authoring
      summary: Validate a candidate document
      description: 'Runs the declared save-time checks and returns every finding, ordered

        and complete rather than first-error.


        It is deliberately EDITION-INDEPENDENT: well-formedness is a fact about

        the document and entitlement is a fact about the licence, so this

        answers identically on every edition and the construct boundary is

        applied at publication. Collapsing the two would leave an author unable

        to tell a broken policy from an unlicensed one.'
      operationId: validateTypedPolicyDocument
      parameters:
      - $ref: '#/components/parameters/TypedAuthoringOrg'
      - $ref: '#/components/parameters/TypedAuthoringUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TypedAuthoringDocumentRequest'
      responses:
        '200':
          description: 'The findings. `success` is false when any finding is a rejection;

            the status is 200 either way, because a validated document that was

            refused is a successful validation.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  findings:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthoringFinding'
        '400':
          description: 'The request carries no document, or one that cannot be parsed. From

            v11.1.0 the body is decoded strictly (#4371): a member the request or document does not declare, a second JSON value, or a `binds_on` that is `null` is refused here (`reason: malformed_request`) rather than ignored.

            '
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/TypedAuthoringUnconfigured'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/typed-policies/publish:
    post:
      tags:
      - Typed Policy Authoring
      summary: Publish a document as a signed artifact
      description: 'Admits the document against the edition''s ceiling, then validates,

        compiles, runs the publication gauntlet, signs and pins it by digest.


        The ceiling is counted on the DOCUMENT ID and admission is idempotent on

        it, so a new version of an existing document spends nothing and an

        author at the ceiling can still edit what they hold.


        Publishing names no approver and there is no field for one. On an

        edition that carries separation of duties this endpoint therefore

        refuses every publication with `APPROVER_IS_AUTHOR`, which is the

        intended behaviour rather than a gap: such a deployment has the customer

        portal, which resolves approvers against the organization''s own

        directory.


        The `author` inside the returned artifact is the caller resolved from

        `X-User-ID`; a value supplied in the request body is overwritten, since

        the author is covered by the signature.'
      operationId: publishTypedPolicyDocument
      parameters:
      - $ref: '#/components/parameters/TypedAuthoringOrg'
      - $ref: '#/components/parameters/TypedAuthoringUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TypedAuthoringDocumentRequest'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  digest:
                    type: string
                    description: The artifact digest. Activation names this, never a version number.
                  version:
                    type: integer
                  findings:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthoringFinding'
                  template_omissions:
                    $ref: '#/components/schemas/TemplateOmissionReport'
                  template_omissions_unavailable:
                    type: string
                    description: 'Present INSTEAD OF `template_omissions` when the report could not be

                      produced. The publication stands; this says why the omissions are not

                      reported.

                      '
        '400':
          description: 'Malformed request, or a document carrying no document_id. From

            v11.1.0 the body is decoded strictly (#4371): a member the request or document does not declare, a second JSON value, or a `binds_on` that is `null` is refused here (`reason: malformed_request`) rather than ignored.

            '
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/TypedAuthoringTierLimit'
        '422':
          description: 'The publication was refused. `findings` carries the declared codes;

            an edition boundary appears as `GROUP_SCOPE_NOT_IN_EDITION`,

            `OBLIGATION_FAMILY_NOT_IN_EDITION`,

            `ATTRIBUTE_NAMESPACE_NOT_IN_EDITION` or

            `CONSTRUCT_HAS_NO_EDITION_RULING`.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reason:
                    type: string
                    enum:
                    - document_refused
                    - publication_refused
                  error:
                    type: string
                  findings:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthoringFinding'
        '429':
          description: This process holds its cap of admitted artifacts for this organization
        '500':
          description: '`workspace_unavailable` (since v11.1.0, #4283; it was `503`): this

            organization''s typed-authoring workspace could not be built on this

            process (a signing key, the authoring plane or an activation

            authority could not be built, or the build did not complete), and a

            retry will not change that. The cause is logged, never returned.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reason:
                    type: string
                    enum:
                    - workspace_unavailable
                  error:
                    type: string
        '503':
          $ref: '#/components/responses/TypedAuthoringUnavailable'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/typed-policies/activate:
    post:
      tags:
      - Typed Policy Authoring
      summary: Activate a published digest
      description: 'Promotes a published artifact to active. The activation is audited and

        names the caller; that is required on every edition, including those

        with no separation of duties, because an unattributed change of enforced

        policy is what the audit trail exists to prevent.


        A published organization document REPLACES the shipped organization

        template, so activating one that omits template policies, or carries one

        under its id but changed (its body, or the schema of an attribute it

        reads), stops those controls deciding as shipped for the organization.

        Such an activation is refused (409, `code:

        TEMPLATE_OMISSIONS_UNACKNOWLEDGED`) unless `acknowledge_template_omissions`

        names exactly those template policy ids - the union of the publication''s

        `template_omissions.omitted` and `template_omissions.modified`. An edit is

        not judged tighter or looser: a changed name or description is reported

        and acknowledged like a changed condition. `GET

        /api/v1/typed-policies/template` returns the template to seed a document

        from.'
      operationId: activateTypedPolicyDigest
      parameters:
      - $ref: '#/components/parameters/TypedAuthoringOrg'
      - $ref: '#/components/parameters/TypedAuthoringUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - digest
              properties:
                digest:
                  type: string
                reason:
                  type: string
                acknowledge_template_omissions:
                  type: array
                  items:
                    type: string
                  description: 'The organization-template policy ids this document omits or carries

                    changed, which stop deciding as shipped for the organization when it is

                    activated. Required, and it must EQUAL the union of the document''s

                    `template_omissions.omitted` and `template_omissions.modified` as a set,

                    whenever that union is not empty; absent or empty when the document

                    carries the template as shipped. Each id once, none empty, and a

                    `reason` that does not itself contain `acknowledged template omissions:`

                    (otherwise 400). The accepted list is recorded in the activation''s

                    `reason` as `[acknowledged template omissions: a, b]`.

                    '
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  activation:
                    $ref: '#/components/schemas/TypedAuthoringActivation'
                  template_omissions:
                    $ref: '#/components/schemas/TemplateOmissionReport'
                  template_omissions_unavailable:
                    type: string
                    description: 'Present INSTEAD OF `template_omissions` when the report could not be

                      produced. THE ACTIVATION STANDS: it has already happened, so the answer

                      remains 200 and this says why the omissions are not reported. Where the

                      activated artifact could not be read back it is a fixed sentence, and the

                      store''s own error is logged rather than returned.

                      '
        '400':
          description: 'Malformed request (`reason: malformed_request`): a body that does not

            decode, an `acknowledge_template_omissions` list with an empty id or an

            id named twice, or a `reason` that itself contains the note an

            acknowledgement is recorded under (`acknowledged template omissions:`,

            compared ignoring case and spacing). From v11.1.0 the body is decoded

            strictly (#4371): a member the request does not declare, or a second

            JSON value, is refused here rather than ignored.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reason:
                    type: string
                    enum:
                    - malformed_request
                  error:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: "Refused on the STATE of what is being activated rather than on the shape\nof the request (`reason: activation_refused`): the digest is not admitted,\nthe version does not advance, the parent is not the active digest, or the\nactor may not activate this version (reload the active version and\nrebase; no `code`). Two refusals carry a `code`:\n\n- `TEMPLATE_OMISSIONS_UNACKNOWLEDGED`: the document omits or changes\n  organization template policies and `acknowledge_template_omissions`\n  does not name exactly those ids (none, fewer, more, or any at all for a\n  document that carries the template as shipped). `template_omissions`\n  reports what the document omits and changes, and `error` says exactly\n  which list to send. Nothing was activated.\n- `TEMPLATE_OMISSIONS_UNAVAILABLE`: the document's omissions could not be\n  computed, so it was not activated. Retry. `error` is a fixed sentence.\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reason:
                    type: string
                    enum:
                    - activation_refused
                  code:
                    type: string
                    enum:
                    - TEMPLATE_OMISSIONS_UNACKNOWLEDGED
                    - TEMPLATE_OMISSIONS_UNAVAILABLE
                  error:
                    type: string
                  template_omissions:
                    $ref: '#/components/schemas/TemplateOmissionReport'
        '500':
          description: 'The artifact this activation names does not verify on load (`reason:

            artifact_unverifiable`): its signing key has been de-authorized, or its

            signature, digest or compiled module no longer holds. Nothing was

            activated, and a retry will not change that. The verification error is

            logged, never returned.


            Or `workspace_unavailable` (since v11.1.0, #4283; it was `503`): this

            organization''s typed-authoring workspace could not be built on this

            process (a signing key, the authoring plane or an activation

            authority could not be built, or the build did not complete), and a

            retry will not change that. The cause is logged, never returned.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reason:
                    type: string
                    enum:
                    - artifact_unverifiable
                    - workspace_unavailable
                  error:
                    type: string
        '503':
          $ref: '#/components/responses/TypedAuthoringUnavailable'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/typed-policies/active:
    get:
      tags:
      - Typed Policy Authoring
      summary: The document currently in force
      description: 'Returns the exact byte sequence that was signed. It parses, re-renders

        identically and recompiles to the module being enforced - all three

        proven before the signature and re-proven on every load.'
      operationId: getActiveTypedPolicyDocument
      parameters:
      - $ref: '#/components/parameters/TypedAuthoringOrg'
      - $ref: '#/components/parameters/TypedAuthoringUser'
      responses:
        '200':
          description: The signed document source
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'Nothing is active on this organization''s authority root (`reason:

            nothing_active`). Answered only when the store was read and holds no

            active document: a store that could not be read answers `503

            storage_unavailable`, never this (#4255).

            '
        '500':
          description: 'The document active on this organization no longer verifies on load

            (`reason: active_unverifiable`, #4255): its signing key has been

            de-authorized, or its signature, digest or compiled module no longer

            holds. It is an integrity fault, not a storage outage, and a

            document that verifies must be activated. The verification

            error is logged, never returned.


            Or `workspace_unavailable` (since v11.1.0, #4283; it was `503`): this

            organization''s typed-authoring workspace could not be built on this

            process (a signing key, the authoring plane or an activation

            authority could not be built, or the build did not complete), and a

            retry will not change that. The cause is logged, never returned.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reason:
                    type: string
                    enum:
                    - active_unverifiable
                    - workspace_unavailable
                  error:
                    type: string
        '503':
          $ref: '#/components/responses/TypedAuthoringUnavailable'
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/typed-policies/active/summary:
    get:
      tags:
      - Typed Policy Authoring
      summary: How many policies are in force on this organization, and whose
      description: 'Counts the policies this organization has in force on the decide scope,

        through the same activation the agent enforces (#4152): the published

        document when one is active, and the implicit baseline when none is.


        - `shipped`: what the platform ships.

        - `organization`: the organization''s own, including the shipped

        controls its document re-actions and the replacements its recorded

        detection overrides carry.

        - `disabled`: the policies of the shipped controls its document

        disabled; one control can bind several. These are not enforced and

        are not in `total`.

        - `not_bound_here`: the ids of the document''s controls whose

        `binds_on` does not name this scope (#4371). They are neither

        enforced nor counted here. Omitted when there are none.


        The installed policy packs are counted by the agent, the only process

        that loads them: this route reads the agent''s summary of the activation

        it enforces (`GET /api/v1/policy-packs/summary` on the agent, an

        internal-service route) and answers it, with `pack` the packs'' policies

        on the scope, `packs_counted` true and `total` including `pack`. A

        deployment that installs no pack, every Community one included, answers

        `pack` 0 with `packs_counted` true: a counted zero, not an unknown. When

        the agent''s summary cannot be read, this route answers its own count,

        in the same shape, with `pack` null, `packs_counted` false and

        `packs_uncounted_reason` naming why; `packs_counted` false means only

        that. One scope is counted and named in `scope`: a policy binds on every

        scope it applies to, so a sum across scopes would count it once per

        scope.'
      operationId: getTypedPolicyActiveSummary
      parameters:
      - $ref: '#/components/parameters/TypedAuthoringOrg'
      - $ref: '#/components/parameters/TypedAuthoringUser'
      responses:
        '200':
          description: The count of the policies in force
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - scope
                - shipped
                - organization
                - pack
                - packs_counted
                - disabled
                - total
                properties:
                  success:
                    type: boolean
                  scope:
                    type: string
                    enum:
                    - decide
                  shipped:
                    type: integer
                  organization:
                    type: integer
                  pack:
                    type:
                    - integer
                    - 'null'
                  packs_counted:
                    type: boolean
                  packs_uncounted_reason:
                    type: string
                    enum:
                    - agent_unreachable
                    - agent_refused
                    - agent_answer_unreadable
                    description: 'Why the installed packs were not counted, present only

                      when `packs_counted` is false: the agent''s summary could

                      not be reached (`agent_unreachable`), the agent answered a

                      non-2xx status (`agent_refused`), or it answered what is

                      not a counted summary of this scope

                      (`agent_answer_unreadable`).

                      '
                  disabled:
                    type: integer
                  total:
                    type: integer
                  not_bound_here:
                    type: array
                    items:
                      type: string
                  detector_not_run_here:
                    type: array
                    description: 'Per control, the registry detector this scope does not

                      run and the planes that do. Every id here is also in

                      `not_bound_here`. Omitted when there are none.

                      '
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        detector:
                          type: string
                        runs_on:
                          type: array
                          items:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: 'The document active on this organization no longer verifies on load

            (`reason: active_unverifiable`), as on `GET

            /api/v1/typed-policies/active`. The verification error is logged,

            never returned.


            Or `workspace_unavailable` (since v11.1.0, #4283; it was `503`): this

            organization''s typed-authoring workspace could not be built on this

            process (a signing key, the authoring plane or an activation

            authority could not be built, or the build did not complete), and a

            retry will not change that. The cause is logged, never returned.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reason:
                    type: string
                    enum:
                    - active_unverifiable
                    - workspace_unavailable
                  error:
                    type: string
        '503':
          description: "The count cannot be given. `reason` says why:\n\n- `catalog_not_configured`, `storage_unavailable`,\n  `ledger_inconsistent`, `workspace_building` and\n  `key_not_loaded`: as on `GET /api/v1/typed-policies/active`. A\n  store that cannot be read is refused, never answered with a count\n  of the implicit baseline.\n- `summary_unavailable`: what is in force could not be activated to\n  be counted, for example because the organization's recorded\n  detection posture could not be read. The cause is logged, never\n  returned.\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reason:
                    type: string
                    enum:
                    - catalog_not_configured
                    - storage_unavailable
                    - ledger_inconsistent
                    - workspace_building
                    - key_not_loaded
                    - summary_unavailable
                  error:
                    type: string
    servers:
    - url: https://orchestrator.getaxonflow.com
      description: Production (SaaS)
    - url: http://localhost:8081
      description: Local Development
  /api/v1/typed-policies/template:
    get:
      tags:
      - Typed Policy Authoring
      summary: The shipped organization template, read-only
      description: 'Returns the organization template this binary shipped: the document a new

        organization draft starts from. A published organization document REPLACES

        the template, so an author seeds a document from it to keep the template''s

        controls deciding; activating a document that omits template policies

        requires naming them (`acknowledge_template_omissions` on activate).


        The same rendering and envelope the customer portal''s

        `GET /api/v1/typed-policies/template` returns. There is no write operation:

        the template is a build constant. Like `system`, it does not require a

        configured typed-authoring vocabulary.'
      operationId: getTypedPolicyOrganizationTemplate
      parameters:
      - $ref: '#/components/parameters/TypedAuthoringOrg'
      - $ref: '#/components/parameters/TypedAuthoringUser'
      responses:
        '200':
          description: The shipped organization template
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  template:
                    type: object
                    properties:
                      id:
                        type: string
                        description: 'The template''s document identifier, as an activation history records it once an organization withdraws its own.

                          '
                      digest:
                        type: string
                        description: The template digest this binary shipped.
                      document:
                        type: object
                        additionalProperties: true
                        description: 'The template itself, the organization-root policy document a draft copies,

                          as the exact canonical bytes the digest is computed over.


                          OPAQUE BY DESIGN, as the system corpus''s `document` is: its interior is the

                          typed document as shipped, and this response does not restate that shape.

