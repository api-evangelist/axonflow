docs_summary: 'AxonFlow uses OAuth2-style Basic authentication for all deployments: Authorization: Basic base64(clientId:clientSecret).
  The client secret is optional in community mode and required in enterprise deployments. Community SaaS requests may add
  X-License-Token (AXON-...) with X-Axonflow-Client set automatically by the SDKs. AWS Marketplace credentials are generated
  at deployment and stored in AWS Secrets Manager at axonflow/customers/{your-org-id}/credentials.'
