aid: axonflow

name: AxonFlow

description: 'AxonFlow is a runtime governance platform for AI agents. It gives every agent a mandate, limits and a paper trail: deterministic
  policies evaluated before an agent acts, human approvals, PII redaction, AI usage budgets, tamper-evident audit logs and decision records exportable
  for frameworks such as the EU AI Act, RBI, SEBI and MAS FEAT. It ships an open-source Community Edition on GitHub, an Evaluation licence and
  a paid production program, runs in the customer''s own environment, and integrates via Python, TypeScript, Go, Java and Rust SDKs and plugins
  for LangChain, LangGraph, CrewAI, LiteLLM, n8n, Claude Code, Cursor and others, plus an optional Fraud & Risk Add-on for payment agents.'

